function OrderBoardView({ user, role }) {
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(false);

      const loadOrders = useCallback(async () => {
        setLoading(true);
        const res = await fbGetSales();
        if (res.success) setSales(res.data);
        setLoading(false);
      }, []);

      useEffect(() => { loadOrders(); }, [loadOrders]);

      const advanceOrder = async (sale, nextStatus) => {
        await fbUpdateSaleStatus(sale.id, nextStatus, user);
        loadOrders();
        Swal.fire({ icon: 'success', title: 'Order ' + nextStatus.toUpperCase(), timer: 1200, showConfirmButton: false });
      };

      const columns = [
        { id: 'pending', title: 'Received', color: '#0284c7', icon: 'fa-clock' },
        { id: 'preparing', title: 'Preparing', color: '#ea580c', icon: 'fa-blender' },
        { id: 'ready', title: 'Ready for Pickup', color: '#16a34a', icon: 'fa-bell' },
        { id: 'completed', title: 'Delivered / Completed', color: '#9333ea', icon: 'fa-circle-check' }
      ];

      return (
        <div className="data-section">
          {loading && <TopLoadingBar />}
          <div className="section-header">
            <div>
              <h2><i className="fas fa-blender"></i> Order Board (Live Kitchen Queue)</h2>
              <div style={{ color: '#64748b', fontSize: '13px', marginTop: 4 }}>
                Real-time beverage queue for baristas and kitchen staff.
              </div>
            </div>
            <button className="btn btn-secondary" onClick={loadOrders}><i className="fas fa-rotate"></i> Refresh Queue</button>
          </div>

          <div className="kanban-grid">
            {columns.map(col => {
              const colOrders = sales.filter(s => (s.status || 'pending') === col.id);
              return (
                <div key={col.id} className="kanban-col">
                  <div className="kanban-col-header" style={{ borderColor: col.color }}>
                    <h4 style={{ color: col.color }}><i className={'fas ' + col.icon}></i> {col.title}</h4>
                    <span className="badge" style={{ background: col.color, color: '#fff' }}>{colOrders.length}</span>
                  </div>

                  <div className="kanban-col-list">
                    {colOrders.length === 0 ? (
                      <div style={{ textAlign: 'center', padding: '30px 10px', color: '#94a3b8', fontSize: '13px' }}>
                        No orders in this stage
                      </div>
                    ) : (
                      colOrders.map(sale => (
                        <div key={sale.id} className="kanban-card">
                          <div className="kanban-card-top">
                            <span style={{ color: 'var(--navy-primary)' }}>#{sale.invoiceNo}</span>
                            <span style={{ fontSize: 11, color: '#64748b' }}>{new Date(sale.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                          </div>
                          <div style={{ fontWeight: 600, fontSize: '13px', marginBottom: 4 }}>
                            {sale.customerName || 'Walk-in Customer'}
                          </div>
                          <div className="kanban-card-items">
                            {(sale.items || []).map((it, idx) => (
                              <div key={idx} style={{ marginBottom: 4 }}>
                                <strong>{it.qty}x</strong> {it.name}
                                {it.size && <span style={{ fontSize: 11, color: '#0284c7' }}> ({it.size})</span>}
                                {it.customization && <div style={{ fontSize: 10.5, color: '#64748b', paddingLeft: 12 }}>{it.customization}</div>}
                              </div>
                            ))}
                          </div>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8, fontSize: 12 }}>
                            <span className="tb-pill role">{sale.paymentMethod || 'Cash'}</span>
                            <strong style={{ color: 'var(--navy-primary)' }}>${Number(sale.grandTotal || 0).toFixed(2)}</strong>
                          </div>
                          <div className="kanban-card-actions">
                            {col.id === 'pending' && (
                              <button className="btn btn-primary" style={{ flex: 1, padding: '5px 8px', fontSize: 12 }} onClick={() => advanceOrder(sale, 'preparing')}>
                                <i className="fas fa-blender"></i> Start

                              <button className="btn btn-success" style={{ flex: 1, padding: '5px 8px', fontSize: 12 }} onClick={() => advanceOrder(sale, 'ready')}>
                                <i className="fas fa-bell"></i> Ready
                              </button>

                              <button className="btn btn-primary" style={{ flex: 1, padding: '5px 8px', fontSize: 12, background: '#9333ea' }} onClick={() => advanceOrder(sale, 'completed')}>
                                <i className="fas fa-check"></i> Complete
                              </button>
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

function PaymentReviewView({ user, role }) {
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(false);
      const [viewReceipt, setViewReceipt] = useState(null);

      const loadSales = useCallback(async () => {
        setLoading(true);
        const res = await fbGetSales();
        if (res.success) setSales(res.data.filter(s => s.paymentMethod === 'Online' || s.paymentMethod === 'Bank Transfer' || s.paymentMethod === 'UPI / QR' || s.receiptImage));
        setLoading(false);
      }, []);

      useEffect(() => { loadSales(); }, [loadSales]);

      const handleApprove = async (sale) => {
        await fbApprovePayment(sale.id, true, user);
        loadSales();
        Swal.fire({ icon: 'success', title: 'Payment Approved!', text: 'Order marked verified and routed to Kitchen queue.', timer: 1400, showConfirmButton: false });
      };

      const handleReject = async (sale) => {
        const confirm = await Swal.fire({
          icon: 'warning',
          title: 'Reject Payment?',
          input: 'text',
          inputPlaceholder: 'Reason for rejection (e.g. invalid transaction ID)',
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Reject'
        });
        if (!confirm.isConfirmed) return;
        await fbApprovePayment(sale.id, false, user);
        loadSales();
        Swal.fire({ icon: 'info', title: 'Payment Rejected', timer: 1400, showConfirmButton: false });
      };

      return (
        <div className="data-section">
          {loading && <TopLoadingBar />}
          <div className="section-header">
            <div>
              <h2><i className="fas fa-magnifying-glass-dollar"></i> Payment Review (Online Slips)</h2>
              <div style={{ color: '#64748b', fontSize: '13px', marginTop: 4 }}>
                Verify incoming customer digital payments, bank slips and QR receipts.
              </div>
            </div>
            <button className="btn btn-secondary" onClick={loadSales}><i className="fas fa-rotate"></i> Refresh</button>
          </div>

          <div className="table-responsive">
            <table className="data-table">
              <thead>
                <tr>
                  <th>Order #</th>
                  <th>Customer</th>
                  <th>Date &amp; Time</th>
                  <th>Method</th>
                  <th>Amount</th>
                  <th>Receipt Slip</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {sales.length === 0 ? (
                  <tr><td colSpan="8" style={{ textAlign: 'center', padding: '30px' }}>No payments pending review.</td></tr>
                ) : (
                  sales.map(s => (
                    <tr key={s.id}>
                      <td><strong>#{s.invoiceNo}</strong></td>
                      <td>{s.customerName || 'Customer'}</td>
                      <td>{new Date(s.date).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</td>
                      <td><span className="tb-pill role">{s.paymentMethod}</span></td>
                      <td><strong>${Number(s.grandTotal || 0).toFixed(2)}</strong></td>
                      <td>
                        {s.receiptImage ? (
                          <button type="button" className="btn btn-secondary" style={{ padding: '3px 8px', fontSize: 11 }} onClick={() => setViewReceipt(s.receiptImage)}>
                            <i className="fas fa-image"></i> View Slip
                          </button>
                        ) : (
                          <span style={{ fontSize: 11, color: '#94a3b8' }}>No file attached</span>
                        )}
                      </td>
                      <td>
                        <span className={'tb-pill ' + (s.paymentApproved === true ? 'ok' : s.paymentApproved === false ? 'off' : 'warn')}>
                          {s.paymentApproved === true ? 'Approved' : s.paymentApproved === false ? 'Rejected' : 'Pending Review'}
                        </span>
                      </td>
                      <td>
                        <div style={{ display: 'flex', gap: 6 }}>
                          <button className="btn btn-success" style={{ padding: '4px 10px', fontSize: 12 }} onClick={() => handleApprove(s)} title="Approve">
                            <i className="fas fa-check"></i>
                          </button>
                          <button className="btn btn-danger" style={{ padding: '4px 10px', fontSize: 12 }} onClick={() => handleReject(s)} title="Reject">
                            <i className="fas fa-xmark"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>

          {viewReceipt && (
            <div className="modal-overlay" onClick={() => setViewReceipt(null)}>
              <div className="modal" style={{ maxWidth: '480px', textAlign: 'center' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3><i className="fas fa-receipt"></i> Payment Slip Preview</h3>
                  <button className="close-btn" onClick={() => setViewReceipt(null)}><i className="fas fa-times"></i></button>
                </div>
                <div className="modal-body" style={{ padding: 16 }}>
                  <img src={viewReceipt} alt="Slip" style={{ maxWidth: '100%', maxHeight: '450px', borderRadius: 8 }} />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AddonsView({ user, role }) {
      const [addons, setAddons] = useState([]);
      const [loading, setLoading] = useState(false);
      const [editingAddon, setEditingAddon] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('ALL');

      const loadAddons = useCallback(async () => {
        setLoading(true);
        const res = await fbGetAddons();
        if (res.success) setAddons(res.data);
        setLoading(false);
      }, []);

      useEffect(() => { loadAddons(); }, [loadAddons]);

      const handleSave = async (data) => {
        const res = await fbSaveAddon(data, user);
        if (res.success) {
          setShowModal(false);
          setEditingAddon(null);
          loadAddons();
          Swal.fire({ icon: 'success', title: 'Add-on Saved', timer: 1400, showConfirmButton: false });
        } else {
          Swal.fire({ icon: 'error', title: 'Save Failed', text: res.message || 'Could not save add-on.' });
        }
      };

      const handleDelete = async (a) => {
        const confirm = await Swal.fire({
          icon: 'warning',
          title: `Delete "${a.name}"?`,
          text: 'This will remove the add-on from POS beverage drink customizer.',
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Yes, delete it'
        });
        if (!confirm.isConfirmed) return;
        await fbDeleteAddon(a.id, a.name, user);
        loadAddons();
      };

      const handleToggle = async (a) => {
        const nextState = a.is_available === false ? true : false;
        await fbSaveAddon(Object.assign({}, a, { is_available: nextState }), user);
        loadAddons();
      };

      // Filter addons by search and category
      const filteredAddons = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return addons.filter(a => {
          const matchCat = selectedCat === 'ALL' || (a.category && a.category === selectedCat);
          if (!matchCat) return false;
          if (!q) return true;
          return (a.name && a.name.toLowerCase().includes(q)) || (a.category && a.category.toLowerCase().includes(q));
        });
      }, [addons, searchQuery, selectedCat]);

      const inStockCount = useMemo(() => addons.filter(a => a.is_available !== false).length, [addons]);
      const outOfStockCount = addons.length - inStockCount;

      const categoryPills = ['ALL', 'Topping', 'Jelly', 'Foam', 'Shot'];

        switch (cat) {
          case 'Topping': return { bg: '#e0f2fe', color: '#0284c7' };
          case 'Jelly': return { bg: '#fef3c7', color: '#b45309' };
          case 'Foam': return { bg: '#fce7f3', color: '#be185d' };
          case 'Shot': return { bg: '#ede9fe', color: '#6d28d9' };
          default: return { bg: '#f1f5f9', color: '#475569' };
        }
      };

      return (
        <div className="data-section">
          {loading && <TopLoadingBar />}

          <div className="section-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
            <div>
              <h2><i className="fas fa-circle-plus" style={{ color: 'var(--navy-accent)', marginRight: 10 }}></i> Drink Add-ons &amp; Customizations</h2>
              <div style={{ color: '#64748b', fontSize: 13, marginTop: 4 }}>
                Boba pearls, popping pearls, jellies, pudding, syrups, and foam toppings for beverage menu.
              </div>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button type="button" className="btn btn-secondary" onClick={loadAddons} title="Reload Add-ons">
                <i className="fas fa-rotate"></i> Refresh
              </button>
              <button type="button" className="btn btn-primary" onClick={() => { setEditingAddon(null); setShowModal(true); }} style={{ fontWeight: 700 }}>
                <i className="fas fa-plus"></i> + Add New Add-on
              </button>
            </div>
          </div>

          {/* KPI Stats Bar */}
          <div className="dash-stats-grid" style={{ marginBottom: 20 }}>
            <div className="stat-card">
              <div className="stat-icon" style={{ background: '#e0f2fe', color: '#0284c7' }}><i className="fas fa-cubes"></i></div>
              <div className="stat-content">
                <div className="stat-value">{addons.length}</div>
                <div className="stat-label">Total Customizers</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{ background: '#dcfce7', color: '#16a34a' }}><i className="fas fa-circle-check"></i></div>
              <div className="stat-content">
                <div className="stat-value">{inStockCount}</div>
                <div className="stat-label">Available In Stock</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{ background: '#fee2e2', color: '#ea4335' }}><i className="fas fa-circle-xmark"></i></div>
              <div className="stat-content">
                <div className="stat-value">{outOfStockCount}</div>
                <div className="stat-label">Out of Stock</div>

function ReportsView({ user, role }) {
      const [sales, setSales] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        setLoading(true);
        Promise.all([fbGetSales(), fbGetExpenses()]).then(([sRes, eRes]) => {
          if (sRes.success) setSales(sRes.data);
          if (eRes.success) setExpenses(eRes.data);
          setLoading(false);
        });
      }, []);

      const totalRevenue = useMemo(() => sales.reduce((sum, s) => sum + Number(s.grandTotal || 0), 0), [sales]);
      const totalOrders = sales.length;
      const totalExpenseAmt = useMemo(() => expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0), [expenses]);
      const netProfit = totalRevenue - totalExpenseAmt;

      return (
        <div className="data-section">
          {loading && <TopLoadingBar />}
          <div className="section-header">
            <h2><i className="fas fa-chart-column"></i> Sales &amp; Financial Analytics</h2>
          </div>

          <div className="lte-kpi-grid">
            <SmallBox value={'$' + totalRevenue.toFixed(2)} label="Gross Revenue" icon="fa-coins" color="bg-navy" />
            <SmallBox value={totalOrders} label="Total Orders" icon="fa-receipt" color="bg-info" />
            <SmallBox value={'$' + totalExpenseAmt.toFixed(2)} label="Expenses" icon="fa-money-bill-trend-up" color="bg-warning" />
            <SmallBox value={'$' + netProfit.toFixed(2)} label="Net Profit" icon="fa-chart-line" color="bg-success" />
          </div>

          <LteCard title="Recent Sales Ledger Summary" icon="fa-table">
            <div className="table-responsive">
              <table className="data-table">
                <thead>
                  <tr>
                    <th>Invoice</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                  </tr>
                </thead>
                <tbody>
                  {sales.slice(0, 10).map(s => (
                    <tr key={s.id}>

                      <td><span className="tb-pill role">{s.paymentMethod}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </LteCard>
        </div>
      );
    }

function MySettingsView({ user, role }) {
      const [tsec, setTsec] = useState('all');

      const [activeThemeId, setActiveThemeId] = useState(() => ls.get('app_theme_id') || 'UI 1');

      const pvTheme = findTheme(previewThemeId) || UI_THEMES[0];
      const filteredThemes = useMemo(() => {
        const q = tq.trim().toLowerCase();
        return UI_THEMES.filter(t => (tsec === 'all' || themeSec(t.id) === tsec) && (!q || t.name.toLowerCase().includes(q) || t.id.toLowerCase().includes(q)));
      }, [tsec, tq]);

      const applyTheme = () => {
        const t = findTheme(previewThemeId) || UI_THEMES[0];
        const v = themeVars(t);
        applyThemeVars(v);
        cacheThemeVars(v);
        ls.set('app_theme_id', t.id);

      return (

                title={'Preview ' + t.name}
              >
                <div className="theme-swatch">
                  <span style={{ background: t.primary }}></span>
                  <span style={{ background: t.secondary }}></span>
                  <span style={{ background: t.bg }}></span>
                  <span style={{ background: t.accent }}></span>
                </div>
                <div className="theme-body">
                  <div className="theme-name">{t.name}</div>
                  <div className="theme-id">
                    {t.id}
                    {activeThemeId === t.id && <span className="theme-default-badge" style={{ background: '#22c55e' }}>ACTIVE</span>}
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="theme-preview-panel" style={{ marginTop: 24 }}>
            <div className="tp-head" style={{ justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span className="tp-title"><i className="fas fa-eye"></i> {pvTheme.name}</span>
                <span className="tp-chip">{pvTheme.id}</span>
                {activeThemeId === pvTheme.id && <span className="tp-tag applied"><i className="fas fa-check"></i> CURRENT</span>}
              </div>
              <button className="btn btn-primary" type="button" onClick={applyTheme}>
                <i className="fas fa-check"></i> Set Now ({pvTheme.name})
              </button>
            </div>

            <div className="tp-mock" style={{ background: pvTheme.bg }}>
              <div className="tp-side" style={{ background: pvTheme.primary }}>
                <div className="tp-logo"></div>
                {['fa-gauge-high', 'fa-table-cells-large', 'fa-boxes-stacked', 'fa-gear'].map(ic => <i className={'fas ' + ic} key={ic}></i>)}
              </div>
              <div className="tp-body2">
                <div className="tp-nav" style={{ background: pvTheme.card }}>
                  <span className="tp-h" style={{ background: pvTheme.secondary }}></span>
                  <span className="tp-av" style={{ background: pvTheme.accent }}></span>
                </div>
                <div className="tp-content">
                  <div className="tp-kpis">
                    {[['128', 'RECORDS', pvTheme.primary, '#fff'], ['$9.4k', 'SALES', pvTheme.secondary, '#fff'], ['+18%', 'PROFIT', pvTheme.accent, pvTheme.onAccent]].map(([n, l, bg, c], i) => (
                      <div key={i} className="tp-kpi" style={{ background: bg, color: c }}>
                        <span className="tp-kpi-n">{n}</span>
                        <span className="tp-kpi-l">{l}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- My Account View ---


function MyAccountView({ user, role }) {
      const [currentPwd, setCurrentPwd] = useState('');
      const [newPwd, setNewPwd] = useState('');
      const [confirmPwd, setConfirmPwd] = useState('');
      const [saving, setSaving] = useState(false);

      const handleChangePwd = (e) => {
        e.preventDefault();
        if (newPwd !== confirmPwd) {
          Swal.fire({ icon: 'error', title: 'Passwords do not match!' });
          return;
        }
        setSaving(true);
        setTimeout(() => {
          setSaving(false);
          setCurrentPwd('');
          setNewPwd('');
          setConfirmPwd('');
          Swal.fire({ icon: 'success', title: 'Password Updated', timer: 1400, showConfirmButton: false });
        }, 600);
      };

      return (
        <div className="data-section" style={{ maxWidth: 640 }}>
          <div className="section-header">
            <h2><i className="fas fa-user-circle"></i> My Account</h2>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 24, padding: 16, background: '#f8fafc', borderRadius: 8 }}>
            <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'var(--navy-primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24 }}>
              <i className="fas fa-user"></i>
            </div>
            <div>
              <h3 style={{ margin: 0, fontSize: 16 }}>{user?.name || 'Administrator'}</h3>
              <p style={{ margin: '2px 0 0', color: '#64748b', fontSize: 13 }}>Role: <span className="tb-pill role">{role}</span> · {user?.email || 'admin@demo.com'}</p>
            </div>
          </div>

          <LteCard title="Change Security Password" icon="fa-lock">
            <form onSubmit={handleChangePwd}>
              <div className="form-group">
                <label>Current Password</label>
                <input type="password" required value={currentPwd} onChange={e => setCurrentPwd(e.target.value)} />
              </div>
              <div className="form-group">
                <label>New Password</label>
                <input type="password" required minLength="6" value={newPwd} onChange={e => setNewPwd(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Confirm New Password</label>
                <input type="password" required minLength="6" value={confirmPwd} onChange={e => setConfirmPwd(e.target.value)} />
              </div>
              <button type="submit" className="btn btn-primary" disabled={saving}>
                {saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-key"></i> Update Password</>}
              </button>
            </form>
          </LteCard>
        </div>
      );
    }


// --- Layout Routing ---
    function MainContent({ activeMenu, user, role, setActiveMenu }) {
      switch (activeMenu) {
        case 'dashboard': return <DashboardView user={user} role={role} setActiveMenu={setActiveMenu} />;
        case 'pos': return <POSView user={user} role={role} />;
        case 'board': return <OrderBoardView user={user} role={role} />;
        case 'review': return <PaymentReviewView user={user} role={role} />;
        case 'sales-history': return <SalesHistoryView user={user} role={role} />;
        case 'products': return <ProductsView user={user} role={role} />;
        case 'categories': return <CategoriesView user={user} role={role} />;
        case 'addons': return <AddonsView user={user} role={role} />;
        case 'stock': return <StockView user={user} role={role} />;
        case 'records': return <RecordsView user={user} role={role} />;
        case 'reports': return <ReportsView user={user} role={role} />;
        case 'expenses': return <ExpensesView user={user} role={role} />;
        case 'suppliers': return <SuppliersView user={user} role={role} />;
        case 'purchase-orders': return <PurchaseOrdersView user={user} role={role} />;
        case 'payment-methods': return <PaymentMethodsView user={user} role={role} />;
        case 'settings': return <SettingsView user={user} role={role} />;
        case 'users': return <UsersView user={user} role={role} />;
        case 'permissions': return <PermissionsView user={user} role={role} />;
        case 'logs': return <LogsView />;
        case 'my-settings': return <MySettingsView user={user} role={role} />;
        case 'my-account': return <MyAccountView user={user} role={role} />;
        case 'about': return <AboutView />;
        default: return null;
      }
    }

    function Dashboard({ user, role, onLogout, themeMode, onThemeToggle }) {
      const [activeMenu, setActiveMenu] = useState(role === 'Admin' ? 'dashboard' : 'records');
      const [collapsed, setCollapsed] = useState(() => localStorage.getItem('sb_collapsed') === '1');
      const [showShortcuts, setShowShortcuts] = useState(false);
      const toggleSidebar = () => setCollapsed(c => { localStorage.setItem('sb_collapsed', c ? '0' : '1'); return !c; });
      const { data: logsData } = useFetch(() => fbGetLogs(), [activeMenu]);
      const notifs = useMemo(() => (logsData && logsData.success ? logsData.data.slice(0, 5).map(l => ({ text: l.action + ': ' + l.detail, icon: 'fa-bell' })) : []), [logsData]);

      const [cfgKey, setCfgKey] = useState(0);
      const { data: cfgData } = useFetch(() => Promise.all([fbGetSettings(), fbGetCategories()]), [cfgKey]);
      const settings = useMemo(() => (cfgData && cfgData[0] && cfgData[0].success ? cfgData[0].data : {}), [cfgData]);
      const categories = useMemo(() => (cfgData && cfgData[1] && cfgData[1].success ? cfgData[1].data : []), [cfgData]);
      useEffect(() => { if (settings && Object.keys(settings).length) applySettings(settings); }, [settings]);
      const refreshConfig = useCallback(() => setCfgKey(k => k + 1), []);

      // global hotkeys
      useEffect(() => {
        const onKeyDown = (e) => {
          if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '') || e.target.isContentEditable) return;
          if (e.key === 'F1') { e.preventDefault(); if (role === 'Admin') setActiveMenu('dashboard'); }
          else if (e.key === 'F2') { e.preventDefault(); setActiveMenu('pos'); }
          else if (e.key === 'F3') { e.preventDefault(); setActiveMenu('products'); }
          else if (e.key === 'F4') { e.preventDefault(); setActiveMenu('records'); }
          else if (e.key === '?') { e.preventDefault(); setShowShortcuts(s => !s); }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [role]);

      const titles = {
        dashboard: 'Dashboard',
        pos: 'QR Sales',
        board: 'Order Board',
        review: 'Payment Review',
        'sales-history': 'All Orders',
        products: 'Products',
        categories: 'Categories',
        addons: 'Add-ons',
        stock: 'Stock In/Out',
        records: 'Customers',
        reports: 'Reports',
        expenses: 'Expenses',
        suppliers: 'Suppliers',
        'purchase-orders': 'Purchase Orders',
        'payment-methods': 'Payment Methods',
        settings: 'Settings',
        users: 'Users',
        permissions: 'Permissions',
        logs: 'Activity Logs',
        'my-settings': 'My Settings',
        'my-account': 'My Account',
        about: 'About'
      };

      const icons = {
        dashboard: 'fa-chart-line',
        pos: 'fa-cash-register',
        board: 'fa-blender',
        review: 'fa-magnifying-glass-dollar',
        'sales-history': 'fa-receipt',
        products: 'fa-mug-hot',
        categories: 'fa-layer-group',
        addons: 'fa-circle-plus',
        stock: 'fa-dolly',
        records: 'fa-user-group',
        reports: 'fa-chart-column',
        expenses: 'fa-money-bill-trend-up',
        suppliers: 'fa-truck-field',
        'purchase-orders': 'fa-file-invoice-dollar',
        'payment-methods': 'fa-building-columns',
        settings: 'fa-sliders',
        users: 'fa-users',
        permissions: 'fa-user-shield',
        logs: 'fa-clock-rotate-left',
        'my-settings': 'fa-palette',
        'my-account': 'fa-user-circle',
        about: 'fa-circle-info'
      };

      return (
        <ConfigContext.Provider value={{ settings, categories, refreshConfig }}>
          <div className="app-container">
            <ProcessingOverlay />
            <Sidebar activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} user={user} onLogout={onLogout} collapsed={collapsed} />
            <div className="main-content">
              <Navbar icon={icons[activeMenu] || 'fa-circle'} title={titles[activeMenu] || 'Shop'} userName={user?.name} role={role} notifs={notifs} onLogout={onLogout} setActiveMenu={setActiveMenu} toggleSidebar={toggleSidebar} themeMode={themeMode} onThemeToggle={onThemeToggle} onOpenShortcuts={() => setShowShortcuts(true)} />
              <MainContent activeMenu={activeMenu} user={user} role={role} setActiveMenu={setActiveMenu} />
            </div>
            <BottomNavigation activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} toggleSidebar={toggleSidebar} />
            {showShortcuts && <ShortcutsModal onClose={() => setShowShortcuts(false)} />}
          </div>
        </ConfigContext.Provider>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [userRole, setUserRole] = useState(null);
      const [checkingSession, setCheckingSession] = useState(true);
      const [themeMode, setThemeMode] = useState(() => ls.get('app_theme_mode') || 'light');

      useEffect(() => {
        applySavedTheme();
        if (themeMode === 'dark') document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
      }, [themeMode]);

      const handleThemeToggle = () => {
        const next = themeMode === 'dark' ? 'light' : 'dark';
        setThemeMode(next);
        ls.set('app_theme_mode', next);
      };

      useEffect(() => {
        const saved = localStorage.getItem('fb_user');
        if (saved) {
          try { const u = JSON.parse(saved); setIsLoggedIn(true); setCurrentUser(u); setUserRole(u.role); } catch (e) { }
        }
        setCheckingSession(false);
      }, []);

      const handleLogin = (user, role) => {
        localStorage.setItem('fb_user', JSON.stringify(user));
        setIsLoggedIn(true); setCurrentUser(user); setUserRole(role);
      };
      const handleLogout = () => {
        localStorage.removeItem('fb_user');
        setIsLoggedIn(false); setCurrentUser(null); setUserRole(null);
      };

      if (checkingSession) return <div className="login-container"><div className="login-box"><i className="fas fa-spinner fa-spin" style={{ fontSize: '40px', color: 'var(--navy-primary)' }}></i></div></div>;

      return <div>{!isLoggedIn ? <LoginPage onLogin={handleLogin} /> : <Dashboard user={currentUser} role={userRole} onLogout={handleLogout} themeMode={themeMode} onThemeToggle={handleThemeToggle} />}</div>;
    }

    class ErrorBoundary extends React.Component {
      state = { err: null };
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err) { console.error('ui crash', err); }
      render() {
        if (this.state.err) return (
          <div className="login-container"><div className="login-box">
            <i className="fas fa-triangle-exclamation" style={{ fontSize: 40, color: 'var(--danger)' }}></i>
            <h2>Something broke</h2>
            <button className="btn btn-primary" onClick={() => location.reload()}><i className="fas fa-rotate"></i> Reload</button>
          </div></div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
