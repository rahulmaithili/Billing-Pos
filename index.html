                  <tr><td>Invoice Number</td><td>Settings prefix + zero-padded 5-digit sequence from /counters/sales (atomic transaction)</td><td>Every sale</td></tr>
                  <tr><td>Gross Profit (per sale)</td><td>(Subtotal − Discount) − Σ (line cost × qty); cost is snapshotted onto each line at checkout so later cost edits don't distort history</td><td>Sales History "Profit" column</td></tr>
                  <tr><td>Total Expenses</td><td>Σ expense amounts over the selected date range / category</td><td>Expenses (feeds Net Profit)</td></tr>
                  <tr><td>Scan Resolve (fast)</td><td>Scanned/typed code matched in-memory against product id, SKU or barcode (instant) — only a miss falls back to a Firebase lookup</td><td>QR Sales / POS</td></tr>
                  <tr><td>Stock Deduction on Sale</td><td>Checkout writes one Stock Out ledger entry per cart line (reason: Sale) — stock only ever changes via the ledger, never a direct qty edit</td><td>POS Checkout → Stock ledger</td></tr>
                  <tr><td>Refund Total</td><td>Σ (qty × price) across the returned lines of a single return; each Return also credits stock back via a Stock In entry (reason: Return)</td><td>Return, Sales History "Returned" column</td></tr>
                  <tr><td>Returnable Qty</td><td>Sold Qty − Σ qty already returned against that sale line (across all prior returns) — caps how much can be returned again</td><td>Process Return</td></tr>
                  <tr><td>Suggested Reorder Qty</td><td>Reorder Qty if set, else max(0, Max Stock − Qty On Hand), else max(0, Reorder Level × 2 − Qty On Hand)</td><td>Reorder Report</td></tr>
                  <tr><td>Product Status</td><td>active / discontinued — discontinued items stay in history &amp; reports but can be filtered out of the working list (delete only as a last resort)</td><td>Products list &amp; Status filter</td></tr>
                  <tr><td>Effective Tax Rate (product)</td><td>Product Tax Rate % if set, otherwise the Settings default tax rate</td><td>Product (POS tax uses it next)</td></tr>
                  <tr><td>Currency Display</td><td>money() prefixes the configured currency symbol (Settings → Currency &amp; Tax); all amounts app-wide follow it</td><td>Every amount shown</td></tr>
                  <tr><td>Categories</td><td>Loaded live from the Categories collection (Settings), not a fixed list — add/remove to fit the business</td><td>Product/Record category dropdowns &amp; filters</td></tr>

          reloadPM();
          Swal.fire({ icon: 'success', title: 'Deleted', text: res.message, timer: 1500, showConfirmButton: false });
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        }
      };

      const handleTogglePM = async (pm, active) => {
        await fbSavePaymentMethod(Object.assign({}, pm, { active }), user);
        reloadPM();
      };

      const handleExportBackup = async () => {
        setLoad('Exporting database backup...');
        const res = await fbExportDatabase();
        setLoad('');
        if (res.success) {
          const blob = new Blob([JSON.stringify(res.data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `pos_backup_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          Swal.fire({ icon: 'success', title: 'Backup Downloaded', text: 'Database exported as JSON.', timer: 1800, showConfirmButton: false });
        } else {
          Swal.fire({ icon: 'error', title: 'Backup Failed', text: res.message });
        }
      };

      const handleRestoreBackup = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            const confirm = await Swal.fire({
              icon: 'warning',
              title: 'Restore Database?',
              text: 'This will replace existing database data with the backup file!',
              showCancelButton: true,
              confirmButtonColor: '#ea4335',
              confirmButtonText: 'Yes, Restore Now'
            });
            if (!confirm.isConfirmed) return;
            setLoad('Restoring database...');
            const res = await fbRestoreDatabase(data, user);
            setLoad('');
            if (res.success) {
              refreshConfig();
              Swal.fire({ icon: 'success', title: 'Database Restored!', text: res.message });
            } else {
              Swal.fire({ icon: 'error', title: 'Restore Failed', text: res.message });
            }
          } catch (err) {
            Swal.fire({ icon: 'error', title: 'Invalid File', text: 'Could not parse JSON backup file.' });
          }
        };
        reader.readAsText(file);
      };

      const addCat = async () => {
        const nm = newCat.trim(); if (!nm) return;
        setLoad('Adding category...');
        const r = await fbAddCategory(nm, user); setLoad('');
        if (r.success) { setNewCat(''); refreshConfig(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
      };
      const delCat = (c) => Swal.fire({ icon: 'warning', title: 'Delete category?', text: c.name, showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (res) => {
        if (!res.isConfirmed) return;
        setLoad('Deleting...'); const r = await fbDeleteCategory(c.id, c.name, user); setLoad('');
        if (r.success) refreshConfig(); else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
      });

      const SETTINGS_TABS = [
        { id: 'shop', label: 'Shop', icon: 'fa-store' },
        { id: 'storefront', label: 'Storefront', icon: 'fa-shop' },
        { id: 'hours', label: 'Opening hours', icon: 'fa-clock' },
        { id: 'ordering', label: 'Ordering & pickup', icon: 'fa-box-open' },
        { id: 'drinks', label: 'Drink options', icon: 'fa-mug-hot' },
        { id: 'paymethods', label: 'Payment Methods', icon: 'fa-credit-card' },
        { id: 'currency', label: 'Currency', icon: 'fa-coins' },
        { id: 'receipts', label: 'Payments & receipts', icon: 'fa-receipt' },
        { id: 'notifications', label: 'Notifications', icon: 'fa-bell' },
        { id: 'backup', label: 'Backup & maintenance', icon: 'fa-shield-halved' },
        { id: 'themes', label: 'Appearance', icon: 'fa-palette' },
        { id: 'categories', label: 'Categories', icon: 'fa-tags' }
      ];

      return (
        <div className="data-section">
          {load && <TopLoadingBar />}
          <div className="section-header">
            <h2><i className="fas fa-gear"></i> Settings &amp; Setup</h2>
            <button className="btn btn-primary" onClick={save} disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save Settings</>}</button>
          </div>

          {/* Navigation Tabs */}
          <div className="settings-nav-tabs" role="tablist">
            {SETTINGS_TABS.map(tab => (
              <button
                key={tab.id}
                type="button"
                className={'settings-nav-tab' + (activeTab === tab.id ? ' active' : '')}
                onClick={() => setActiveTab(tab.id)}
              >
                <i className={'fas ' + tab.icon}></i>
                <span>{tab.label}</span>
              </button>
            ))}
          </div>

          {/* 1. Shop Tab */}
          {activeTab === 'shop' && (
            <LteCard title="Shop (Name, contact and logo)" icon="fa-store">
              <div className="form-grid">
                <div className="form-group"><label>Shop / Business Name *</label><input type="text" value={form.businessName || ''} onChange={e => upd('businessName', e.target.value)} placeholder="e.g. Boba & Co. Cafe" /></div>
                <div className="form-group"><label>Contact Phone</label><input type="text" value={form.phone || ''} onChange={e => upd('phone', e.target.value)} placeholder="+1 234 567 8900" /></div>
                <div className="form-group"><label>Email Address</label><input type="email" value={form.email || ''} onChange={e => upd('email', e.target.value)} placeholder="shop@domain.com" /></div>
                <div className="form-group"><label>Logo Image URL</label><input type="text" value={form.logoUrl || ''} onChange={e => upd('logoUrl', e.target.value)} placeholder="https://... logo.png" /></div>
                <div className="form-group"><label><i className="fas fa-qrcode"></i> Store UPI ID / VPA (Dynamic QR)</label><input type="text" value={form.upiId || ''} onChange={e => upd('upiId', e.target.value)} placeholder="e.g. 9876543210@paytm or shop@okaxis" /></div>
                <div className="form-group"><label>UPI Merchant Name</label><input type="text" value={form.upiPayeeName || ''} onChange={e => upd('upiPayeeName', e.target.value)} placeholder="Display name on customer payment app" /></div>
              </div>
              <div className="form-group"><label>Physical Address</label><textarea rows="2" value={form.address || ''} onChange={e => upd('address', e.target.value)} placeholder="Store location, street, city"></textarea></div>
              {form.logoUrl && (
                <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 12 }}>
                  <img src={form.logoUrl} alt="Logo preview" style={{ width: 48, height: 48, borderRadius: '50%', objectFit: 'cover', border: '1px solid #cbd5e1' }} onError={e => e.target.style.display = 'none'} />
                  <span style={{ fontSize: 12, color: '#64748b' }}>Logo Preview</span>
                </div>
              )}
            </LteCard>
          )}

          {/* 2. Storefront Tab */}
          {activeTab === 'storefront' && (
            <LteCard title="Storefront (Headline, about text, banner)" icon="fa-shop">
              <div className="form-group"><label>Storefront Headline</label><input type="text" value={form.storeHeadline || ''} onChange={e => upd('storeHeadline', e.target.value)} placeholder="e.g. Specialty Handcrafted Boba Drinks & Artisanal Coffee" /></div>
              <div className="form-group"><label>About Text</label><textarea rows="3" value={form.storeAbout || ''} onChange={e => upd('storeAbout', e.target.value)} placeholder="Share your store story and customer promise..."></textarea></div>
              <div className="form-group"><label>Hero Banner Image URL</label><input type="text" value={form.heroBannerUrl || ''} onChange={e => upd('heroBannerUrl', e.target.value)} placeholder="https://... banner.jpg" /></div>
              <div className="form-group"><label>Announcement / Top Banner Bar</label><input type="text" value={form.announcement || ''} onChange={e => upd('announcement', e.target.value)} placeholder="e.g. Happy Hour Special: Buy 1 Get 1 Free on all Fruit Teas between 3-5 PM!" /></div>
              {form.heroBannerUrl && (
                <div style={{ marginTop: 12 }}>
                  <img src={form.heroBannerUrl} alt="Banner preview" style={{ width: '100%', maxHeight: 160, objectFit: 'cover', borderRadius: 8, border: '1px solid #e2e8f0' }} onError={e => e.target.style.display = 'none'} />
                </div>
              )}
            </LteCard>
          )}

          {/* 3. Opening hours Tab */}
          {activeTab === 'hours' && (
            <LteCard title="Opening hours (Weekly hours, last order)" icon="fa-clock">
              <div className="form-grid">
                <div className="form-group">
                  <label><i className="fas fa-door-open"></i> Store Live Status</label>
                  <div>
                    <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                      <input type="checkbox" className="toggle" checked={form.isStoreOpen !== false} onChange={e => upd('isStoreOpen', e.target.checked)} />
                      <span>{form.isStoreOpen !== false ? <strong style={{ color: '#22c55e' }}>Currently OPEN</strong> : <strong style={{ color: '#ef4444' }}>Currently CLOSED</strong>}</span>
                    </label>
                  </div>
                </div>
                <div className="form-group"><label>Last Order Cutoff (Minutes before close)</label><input type="number" min="0" step="5" value={form.lastOrderMinutes ?? 30} onChange={e => upd('lastOrderMinutes', e.target.value)} placeholder="30" /></div>
                <div className="form-group"><label>Daily Opening Time</label><input type="time" value={form.openingTime || '08:00'} onChange={e => upd('openingTime', e.target.value)} /></div>
                <div className="form-group"><label>Daily Closing Time</label><input type="time" value={form.closingTime || '22:00'} onChange={e => upd('closingTime', e.target.value)} /></div>
              </div>
              <div className="form-group"><label>Weekly Schedule Summary</label><textarea rows="2" value={form.weeklySchedule || ''} onChange={e => upd('weeklySchedule', e.target.value)} placeholder="e.g. Mon - Fri: 8:00 AM - 10:00 PM&#10;Sat - Sun: 9:00 AM - 11:00 PM"></textarea></div>
            </LteCard>
          )}

          {/* 4. Ordering & pickup Tab */}
          {activeTab === 'ordering' && (
            <LteCard title="Ordering & pickup (Pause, prep time, delivery)" icon="fa-box-open">
              <div className="form-grid">
                <div className="form-group">
                  <label><i className="fas fa-pause"></i> Temporary Store Pause</label>
                  <div>
                    <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                      <input type="checkbox" className="toggle" checked={!!form.isPaused} onChange={e => upd('isPaused', e.target.checked)} />
                      <span>{form.isPaused ? <strong style={{ color: '#ef4444' }}>Orders PAUSED</strong> : <span style={{ color: '#64748b' }}>Normal Operations</span>}</span>
                    </label>
                  </div>
                </div>
                <div className="form-group"><label>Default Preparation Time (mins)</label><input type="number" min="1" step="1" value={form.defaultPrepTime ?? 10} onChange={e => upd('defaultPrepTime', e.target.value)} placeholder="10" /></div>
                <div className="form-group"><label><i className="fas fa-truck"></i> Enable Delivery</label><div><input type="checkbox" className="toggle" checked={form.deliveryEnabled !== false} onChange={e => upd('deliveryEnabled', e.target.checked)} /></div></div>
                <div className="form-group"><label>Standard Delivery Fee</label><input type="number" min="0" step="0.01" value={form.deliveryFee ?? 0} onChange={e => upd('deliveryFee', e.target.value)} placeholder="0.00" /></div>
                <div className="form-group"><label>Minimum Order Amount</label><input type="number" min="0" step="0.01" value={form.minOrderAmount ?? 0} onChange={e => upd('minOrderAmount', e.target.value)} placeholder="0.00" /></div>
              </div>
              {form.isPaused && (
                <div className="form-group"><label>Pause Notice to Customers</label><input type="text" value={form.pauseReason || ''} onChange={e => upd('pauseReason', e.target.value)} placeholder="e.g. Restocking fresh boba, back in 15 minutes!" /></div>
              )}
            </LteCard>
          )}

          {/* 5. Drink options & Demo Drinks Tab */}
          {activeTab === 'drinks' && (
            <div>
              <LteCard title="Drink options (Sugar and ice levels)" icon="fa-mug-hot">
                <div className="form-group">
                  <label><i className="fas fa-cubes-stacked"></i> Configured Sugar Levels (comma-separated)</label>
                  <input type="text" value={form.sugarLevels || ''} onChange={e => upd('sugarLevels', e.target.value)} placeholder="100% (Regular), 70% (Less Sweet), 50% (Half Sweet), 30% (Slight Sweet), 0% (No Sugar)" />
                  <small style={{ color: '#64748b' }}>Used for customizing beverage sweetness during order and till entry.</small>
                </div>
                <div className="form-group" style={{ marginTop: 14 }}>
                  <label><i className="fas fa-snowflake"></i> Configured Ice Levels (comma-separated)</label>
                  <input type="text" value={form.iceLevels || ''} onChange={e => upd('iceLevels', e.target.value)} placeholder="Regular Ice, Less Ice, No Ice, Warm / Hot" />
                  <small style={{ color: '#64748b' }}>Used for specifying temperature and ice preference.</small>
                </div>
                <div className="form-group" style={{ marginTop: 14 }}>
                  <label><i className="fas fa-circle-plus"></i> Available Add-ons &amp; Toppings (comma-separated)</label>
                  <input type="text" value={form.availableAddons || ''} onChange={e => upd('availableAddons', e.target.value)} placeholder="Tapioca Pearls, Coconut Jelly, Grass Jelly, Popping Boba, Cheese Foam" />
                  <small style={{ color: '#64748b' }}>Extra beverage add-ons offered to customers.</small>
                </div>
              </LteCard>

              <LteCard title="Demo Drinks Seeder" icon="fa-wand-magic-sparkles">
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 14 }}>
                  <div>
                    <h4 style={{ margin: '0 0 6px 0', fontSize: 15 }}>Seed Specialty Cafe &amp; Drink Catalog</h4>
                    <p style={{ margin: 0, color: '#64748b', fontSize: 13 }}>
                      Instantly populate 8 ready-to-sell specialty drinks (Brown Sugar Boba, Matcha Latte, Macchiato, Smoothies, Fruit Teas) with SKUs, prices, costs, and warehouse stock.
                    </p>
                  </div>
                  <button type="button" className="btn btn-success" onClick={handleSeedDrinks}>
                    <i className="fas fa-wand-magic-sparkles"></i> Seed 8 Demo Drinks
                  </button>
                </div>
              </LteCard>
            </div>
          )}

          {/* 6. Payment Methods Tab */}
          {activeTab === 'paymethods' && (
            <LteCard title="Payment Methods (Setup, QR and receipt rules)" icon="fa-credit-card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                <p style={{ margin: 0, color: '#64748b', fontSize: 13 }}>Configure all supported payment methods (Cash, Cards, UPI QR, Bank, Due/Credit).</p>
                <button type="button" className="btn btn-success btn-sm" onClick={() => { setEditingPM(null); setShowPMModal(true); }}>
                  <i className="fas fa-plus"></i> Add Method
                </button>
              </div>

              {loadingPM ? <TableSkeleton rows={4} columns={3} /> : (
                <div>
                  {payMethods.map(pm => (
                    <div className="pm-card" key={pm.id}>
                      <div className="pm-info">
                        <div className="pm-icon"><i className={'fas ' + (pm.icon || 'fa-credit-card')}></i></div>
                        <div>
                          <div className="pm-title">
                            {pm.name}
                            {pm.active ? <span className="status-badge status-active" style={{ marginLeft: 8 }}>Active</span> : <span className="status-badge status-inactive" style={{ marginLeft: 8 }}>Disabled</span>}
                            {pm.requiresReceipt && <span className="status-badge status-inactive" style={{ marginLeft: 6, background: '#fef3c7', color: '#92400e' }}>Receipt Required</span>}
                          </div>
                          <div className="pm-sub">{pm.details || 'No specific details configured'} · Code: <code>{pm.code || pm.name}</code></div>
                        </div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                        <input type="checkbox" className="toggle" checked={pm.active !== false} onChange={e => handleTogglePM(pm, e.target.checked)} title="Toggle active status" />
                        <button type="button" className="action-icon edit-icon" onClick={() => { setEditingPM(pm); setShowPMModal(true); }} title="Edit"><i className="fas fa-edit"></i></button>
                        <button type="button" className="action-icon delete-icon" onClick={() => handleDeletePM(pm)} title="Delete"><i className="fas fa-trash"></i></button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </LteCard>
          )}

          {/* 7. Currency Tab */}
          {activeTab === 'currency' && (
            <LteCard title="Currency (Symbol and decimals)" icon="fa-coins">
              <div className="form-grid">
                <div className="form-group"><label>Currency Symbol</label><input type="text" value={form.currencySymbol || ''} onChange={e => upd('currencySymbol', e.target.value)} placeholder="$, Rs, ₹, £, €..." /></div>
                <div className="form-group"><label>Currency Code</label><input type="text" value={form.currencyCode || ''} onChange={e => upd('currencyCode', e.target.value)} placeholder="USD, PKR, INR, EUR..." /></div>
                <div className="form-group">
                  <label>Currency Decimals</label>
                  <select value={form.currencyDecimals ?? 2} onChange={e => upd('currencyDecimals', Number(e.target.value))}>
                    <option value={2}>2 Decimals (Standard: $10.50)</option>
                    <option value={0}>0 Decimals (Whole numbers: 100 NT$, Rs 500)</option>
                  </select>
                </div>
                <div className="form-group"><label>Default Tax Rate (%)</label><input type="number" step="0.01" min="0" value={form.taxRate ?? ''} onChange={e => upd('taxRate', e.target.value)} placeholder="0" /></div>
                <div className="form-group"><label>Low Stock Default Threshold</label><input type="number" step="1" min="0" value={form.lowStockDefault ?? 5} onChange={e => upd('lowStockDefault', e.target.value)} /></div>
                <div className="form-group"><label><i className="fas fa-toggle-on"></i> Prices Include Tax</label><div><input type="checkbox" className="toggle" checked={!!form.taxInclusive} onChange={e => upd('taxInclusive', e.target.checked)} /></div></div>
              </div>
            </LteCard>
          )}

          {/* 8. Payments & receipts Tab */}
          {activeTab === 'receipts' && (
            <LteCard title="Payments & receipts (Receipt roll, letterhead, dates)" icon="fa-receipt">
              <div className="form-grid">
                <div className="form-group">
                  <label>Thermal Receipt Roll Width</label>
                  <select value={form.receiptRollWidth || '80mm'} onChange={e => upd('receiptRollWidth', e.target.value)}>
                    <option value="80mm">80mm (Standard POS Thermal Printer)</option>
                    <option value="58mm">58mm (Compact Mobile POS Printer)</option>
                  </select>
                </div>
                <div className="form-group"><label>Invoice Prefix</label><input type="text" value={form.invoicePrefix || ''} onChange={e => upd('invoicePrefix', e.target.value)} placeholder="INV-" /></div>
                <div className="form-group">
                  <label>Display Date Format</label>
                  <select value={form.dateFormat || 'DD/MM/YYYY'} onChange={e => upd('dateFormat', e.target.value)}>
                    <option value="DD/MM/YYYY">DD/MM/YYYY (e.g. 25/12/2026)</option>
                    <option value="MM/DD/YYYY">MM/DD/YYYY (e.g. 12/25/2026)</option>
                    <option value="YYYY-MM-DD">YYYY-MM-DD (e.g. 2026-12-25)</option>
                  </select>
                </div>
                <div className="form-group">
                  <label><i className="fas fa-receipt"></i> Require Receipt Upload for Online / Bank</label>
                  <div><input type="checkbox" className="toggle" checked={!!form.requireReceiptUpload} onChange={e => upd('requireReceiptUpload', e.target.checked)} /></div>
                </div>
              </div>
              <div className="form-group"><label>Payment Instructions (Shown to customers)</label><textarea rows="2" value={form.paymentInstructions || ''} onChange={e => upd('paymentInstructions', e.target.value)} placeholder="e.g. Please share payment screenshot on WhatsApp or upload above."></textarea></div>
              <div className="form-group"><label>Receipt Header / Letterhead</label><textarea rows="2" value={form.receiptHeader || ''} onChange={e => upd('receiptHeader', e.target.value)} placeholder="Shown on top of receipt below shop title"></textarea></div>
              <div className="form-group"><label>Receipt Footer Note</label><textarea rows="2" value={form.receiptFooter || ''} onChange={e => upd('receiptFooter', e.target.value)} placeholder="e.g. Thank you for your visit! Please visit us again."></textarea></div>
            </LteCard>
          )}

          {/* 9. Notifications Tab */}
          {activeTab === 'notifications' && (
            <LteCard title="Notifications (Shop + customer emails)" icon="fa-bell">
              <div className="form-grid">
                <div className="form-group"><label>Shop Admin Notification Email</label><input type="email" value={form.notifyAdminEmail || ''} onChange={e => upd('notifyAdminEmail', e.target.value)} placeholder="orders@yourshop.com" /></div>
                <div className="form-group"><label><i className="fas fa-envelope"></i> Send Customer Email Confirmations</label><div><input type="checkbox" className="toggle" checked={form.orderEmailAlerts !== false} onChange={e => upd('orderEmailAlerts', e.target.checked)} /></div></div>
              </div>
              <div className="form-group" style={{ marginTop: 14 }}>
                <label><i className="fab fa-whatsapp"></i> WhatsApp Order Ready Message Template</label>
                <textarea rows="3" value={form.whatsappTemplate || ''} onChange={e => upd('whatsappTemplate', e.target.value)} placeholder="Hi {customer}, your order #{invoice} of {amount} is ready for pickup!"></textarea>
                <small style={{ color: '#64748b' }}>Available tokens: <code>{'{customer}'}</code>, <code>{'{invoice}'}</code>, <code>{'{amount}'}</code></small>
              </div>
            </LteCard>
          )}

          {/* 10. Backup & maintenance Tab */}
          {activeTab === 'backup' && (
            <LteCard title="Backup & maintenance (Nightly backup, safety tools)" icon="fa-shield-halved">
              <div className="form-group" style={{ marginBottom: 18 }}>
                <label><i className="fas fa-cloud-arrow-up"></i> Nightly Automatic Database Backup</label>
                <div>
                  <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                    <input type="checkbox" className="toggle" checked={form.nightlyBackupEnabled !== false} onChange={e => upd('nightlyBackupEnabled', e.target.checked)} />
                    <span>{form.nightlyBackupEnabled !== false ? 'Enabled (Automated cloud snapshot schedule)' : 'Disabled'}</span>
                  </label>
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 16 }}>
                <div style={{ padding: 16, border: '1px solid #e2e8f0', borderRadius: 8, background: '#f8fafc' }}>
                  <h4 style={{ margin: '0 0 6px 0', fontSize: 15 }}><i className="fas fa-download"></i> Export Database (JSON)</h4>
                  <p style={{ fontSize: 12.5, color: '#64748b', margin: '0 0 12px 0' }}>Download a complete real-time JSON backup of all products, sales, inventory logs, and settings.</p>
                  <button type="button" className="btn btn-primary" onClick={handleExportBackup}><i className="fas fa-file-export"></i> Download Backup JSON</button>
                </div>

                <div style={{ padding: 16, border: '1px solid #e2e8f0', borderRadius: 8, background: '#f8fafc' }}>
                  <h4 style={{ margin: '0 0 6px 0', fontSize: 15 }}><i className="fas fa-upload"></i> Restore Database (JSON)</h4>
                  <p style={{ fontSize: 12.5, color: '#64748b', margin: '0 0 12px 0' }}>Upload a previous JSON backup file to completely restore your store data.</p>
                  <input ref={backupInputRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={handleRestoreBackup} />
                  <button type="button" className="btn btn-secondary" onClick={() => backupInputRef.current && backupInputRef.current.click()}><i className="fas fa-file-import"></i> Upload &amp; Restore</button>
                </div>
              </div>
            </LteCard>
          )}

          {/* 11. Appearance & Themes Tab */}
          {activeTab === 'themes' && (
            <LteCard title="Appearance & Themes (36 Modern UI Palettes)" icon="fa-palette">
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: 12, background: 'rgba(0,116,217,0.08)', borderRadius: 6, marginBottom: 16 }}>
                <i className="fas fa-circle-info" style={{ color: 'var(--navy-accent)' }}></i>
                <span>Tap any palette to preview live below, then click <strong>Set Now</strong> to apply across the entire application.</span>
              </div>

              <div className="thm-bar">
                <div className="thm-chips">
                  {THEME_SECTIONS.map(([k, lbl, ic]) => (
                    <button key={k} type="button" className={'thm-chip' + (tsec === k ? ' on' : '')} onClick={() => setTsec(k)}>
                      <i className={'fas ' + ic}></i> {lbl}
                    </button>
                  ))}
                </div>
                <div className="thm-search">
                  <i className="fas fa-magnifying-glass"></i>
                  <input type="text" value={tq} placeholder="Search palettes..." onChange={(e) => setTq(e.target.value)} />
                </div>
              </div>

              <p style={{ fontSize: 12.5, color: '#718096', marginBottom: 12 }}><i className="fas fa-swatchbook"></i> Showing {filteredThemes.length} of {UI_THEMES.length} palettes</p>

              <div className="theme-gallery">
                {filteredThemes.map((t) => (
                  <div
                    key={t.id}
                    className={'theme-card' + (activeThemeId === t.id ? ' active' : '') + (previewThemeId === t.id ? ' previewing' : '')}
                    onClick={() => { setPreviewThemeId(t.id); applyThemeVars(themeVars(t)); }}
                    title={'Preview ' + t.name}
                  >
                    <div className="theme-swatch">
                      <span style={{background: t.primary}}></span>
                      <span style={{background: t.secondary}}></span>
                      <span style={{background: t.bg}}></span>
                      <span style={{background: t.accent}}></span>
                    </div>
                    <div className="theme-body">
                      <div className="theme-name">{t.name}</div>
                      <div className="theme-id">
                        {t.id}
                        {activeThemeId === t.id && <span className="theme-default-badge" style={{ background: '#22c55e' }}>ACTIVE</span>}
                      </div>
                    </div>
                  </div>
                ))}
                {!filteredThemes.length && <div style={{ padding: 20, textAlign: 'center', color: '#999', gridColumn: '1/-1' }}><i className="fas fa-circle-exclamation"></i> No palette matches that search.</div>}
              </div>

              <div className="theme-preview-panel">
                <div className="tp-head" style={{ justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span className="tp-title"><i className="fas fa-eye"></i> {pvTheme.name}</span>
                    <span className="tp-chip">{pvTheme.id}</span>
                    {activeThemeId === pvTheme.id && <span className="tp-tag applied"><i className="fas fa-check"></i> CURRENT</span>}
                  </div>
                  <button className="btn btn-primary" type="button" onClick={applyThemeFromSettings}><i className="fas fa-check"></i> Set Now ({pvTheme.name})</button>
                </div>

                <div className="tp-mock" style={{background: pvTheme.bg}}>
                  <div className="tp-side" style={{background: pvTheme.primary}}>
                    <div className="tp-logo"></div>
                    {['fa-gauge-high','fa-table-cells-large','fa-boxes-stacked','fa-gear'].map(ic => <i className={'fas ' + ic} key={ic}></i>)}
                  </div>
                  <div className="tp-body2">
                    <div className="tp-nav" style={{background: pvTheme.card}}>
                      <span className="tp-h" style={{background: pvTheme.secondary}}></span>
                      <span className="tp-av" style={{background: pvTheme.accent}}></span>
                    </div>
                    <div className="tp-content">
                      <div className="tp-kpis">
                        {[['128','RECORDS',pvTheme.primary,'#fff'],['$9.4k','SALES',pvTheme.secondary,'#fff'],['+18%','PROFIT',pvTheme.accent,pvTheme.onAccent]].map(([n,l,bg,c],i) => (
                          <div key={i} className="tp-kpi" style={{background: bg, color: c}}>
                            <span className="tp-kpi-n">{n}</span>
                            <span className="tp-kpi-l">{l}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </LteCard>
          )}

          {/* 12. Categories Tab */}
          {activeTab === 'categories' && (
            <LteCard title="Product Categories (Taxonomy)" icon="fa-tags">
              <div className="pos-scan-box" style={{ marginBottom: 14 }}>
                <div className="form-group" style={{ flex: 1, marginBottom: 0 }}><label>New Category</label><input type="text" value={newCat} onChange={(e) => setNewCat(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addCat(); } }} placeholder="e.g. Beverages" /></div>
                <button className="btn btn-success" onClick={addCat}><i className="fas fa-plus"></i> Add</button>
              </div>
              <div className="cat-chip-wrap">
                {categories.length === 0 ? <p style={{ color: '#999' }}>No categories yet.</p> : categories.map(c => (
                  <span className="cat-chip" key={c.id}><i className="fas fa-tag"></i> {c.name}<button onClick={() => delCat(c)} title="Delete"><i className="fas fa-times"></i></button></span>
                ))}
              </div>
            </LteCard>
          )}

          {showPMModal && <PaymentMethodModal method={editingPM} onClose={() => { setShowPMModal(false); setEditingPM(null); }} onSave={handleSavePM} />}
        </div>
      );
    }

    // --- Layout ---
    function MainContent({ activeMenu, user, role, setActiveMenu }) {
      switch (activeMenu) {
        case 'dashboard': return <DashboardView user={user} role={role} setActiveMenu={setActiveMenu} />;
        case 'pos': return <POSView user={user} role={role} />;
        case 'products': return <ProductsView user={user} role={role} />;
        case 'stock': return <StockView user={user} role={role} />;
        case 'sales-history': return <SalesHistoryView user={user} role={role} />;
        case 'records': return <RecordsView user={user} role={role} />;
        case 'suppliers': return <SuppliersView user={user} role={role} />;
        case 'purchase-orders': return <PurchaseOrdersView user={user} role={role} />;
        case 'expenses': return <ExpensesView user={user} role={role} />;
        case 'users': return <UsersView user={user} role={role} />;
        case 'settings': return <SettingsView user={user} role={role} />;
        case 'logs': return <LogsView />;
        case 'about': return <AboutView />;
        default: return null;
      }
    }

    function Dashboard({ user, role, onLogout, themeMode, onThemeToggle }) {
      const [activeMenu, setActiveMenu] = useState(role === 'Admin' ? 'dashboard' : 'records');
      const [collapsed, setCollapsed] = useState(() => localStorage.getItem('sb_collapsed') === '1');
      const [showShortcuts, setShowShortcuts] = useState(false);
      const toggleSidebar = () => setCollapsed(c => { localStorage.setItem('sb_collapsed', c ? '0' : '1'); return !c; });
      const { data: logsData } = useFetch(() => fbGetLogs(), [activeMenu]);
      const notifs = useMemo(() => (logsData && logsData.success ? logsData.data.slice(0, 5).map(l => ({ text: `${l.action}: ${l.detail}`, icon: 'fa-bell' })) : []), [logsData]);

      // app config (settings + categories) loaded once here, shared via context; mirrored into CFG for non-component code
      const [cfgKey, setCfgKey] = useState(0);
      const { data: cfgData } = useFetch(() => Promise.all([fbGetSettings(), fbGetCategories()]), [cfgKey]);
      const settings = useMemo(() => (cfgData && cfgData[0] && cfgData[0].success ? cfgData[0].data : {}), [cfgData]);
      const categories = useMemo(() => (cfgData && cfgData[1] && cfgData[1].success ? cfgData[1].data : []), [cfgData]);
      useEffect(() => { if (settings && Object.keys(settings).length) applySettings(settings); }, [settings]);
      const refreshConfig = useCallback(() => setCfgKey(k => k + 1), []);

      // global hotkeys
      useEffect(() => {
        const onKeyDown = (e) => {
          if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '') || e.target.isContentEditable) return;
          if (e.key === 'F1') { e.preventDefault(); if (role === 'Admin') setActiveMenu('dashboard'); }
          else if (e.key === 'F2') { e.preventDefault(); setActiveMenu('pos'); }
          else if (e.key === 'F3') { e.preventDefault(); setActiveMenu('products'); }
          else if (e.key === 'F4') { e.preventDefault(); setActiveMenu('records'); }
          else if (e.key === '?') { e.preventDefault(); setShowShortcuts(s => !s); }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [role]);

      const titles = { dashboard: 'Dashboard', pos: 'QR Sales', products: 'Products', stock: 'Stock In/Out', 'sales-history': 'Sales History', records: 'Customers', suppliers: 'Suppliers', 'purchase-orders': 'Purchase Orders', expenses: 'Expenses', users: 'Users', settings: 'Settings', logs: 'Activity Logs', about: 'About App' };
      const icons = { dashboard: 'fa-chart-line', pos: 'fa-cash-register', products: 'fa-boxes-stacked', stock: 'fa-dolly', 'sales-history': 'fa-receipt', records: 'fa-address-book', suppliers: 'fa-truck-field', 'purchase-orders': 'fa-file-invoice-dollar', expenses: 'fa-money-bill-trend-up', users: 'fa-users-cog', settings: 'fa-gear', logs: 'fa-history', about: 'fa-info-circle' };
      return (
        <ConfigContext.Provider value={{ settings, categories, refreshConfig }}>
          <div className="app-container">
            <ProcessingOverlay />
            <Sidebar activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} user={user} onLogout={onLogout} collapsed={collapsed} />
            <div className="main-content">
              <Navbar icon={icons[activeMenu]} title={titles[activeMenu]} userName={user?.name} role={role} notifs={notifs} onLogout={onLogout} setActiveMenu={setActiveMenu} toggleSidebar={toggleSidebar} themeMode={themeMode} onThemeToggle={onThemeToggle} onOpenShortcuts={() => setShowShortcuts(true)} />
              <MainContent activeMenu={activeMenu} user={user} role={role} setActiveMenu={setActiveMenu} />
            </div>
            <BottomNavigation activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} toggleSidebar={toggleSidebar} />
            {showShortcuts && <ShortcutsModal onClose={() => setShowShortcuts(false)} />}
          </div>
        </ConfigContext.Provider>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [userRole, setUserRole] = useState(null);
      const [checkingSession, setCheckingSession] = useState(true);
      const [themeMode, setThemeMode] = useState(() => ls.get('app_theme_mode') || 'light');

      useEffect(() => {
        applySavedTheme();
        if (themeMode === 'dark') document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
      }, [themeMode]);

      const handleThemeToggle = () => {
        const next = themeMode === 'dark' ? 'light' : 'dark';
        setThemeMode(next);
        ls.set('app_theme_mode', next);
      };

      useEffect(() => {
        const saved = localStorage.getItem('fb_user');
        if (saved) {
          try { const u = JSON.parse(saved); setIsLoggedIn(true); setCurrentUser(u); setUserRole(u.role); } catch (e) { }
        }
        setCheckingSession(false);
      }, []);

      const handleLogin = (user, role) => {
        localStorage.setItem('fb_user', JSON.stringify(user));
        setIsLoggedIn(true); setCurrentUser(user); setUserRole(role);
      };
      const handleLogout = () => {
        localStorage.removeItem('fb_user');
        setIsLoggedIn(false); setCurrentUser(null); setUserRole(null);
      };

      if (checkingSession) return <div className="login-container"><div className="login-box"><i className="fas fa-spinner fa-spin" style={{ fontSize: '40px', color: 'var(--navy-primary)' }}></i></div></div>;

      return <div>{!isLoggedIn ? <LoginPage onLogin={handleLogin} /> : <Dashboard user={currentUser} role={userRole} onLogout={handleLogout} themeMode={themeMode} onThemeToggle={handleThemeToggle} />}</div>;
    }

    class ErrorBoundary extends React.Component {
      state = { err: null };
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err) { console.error('ui crash', err); }
      render() {
        if (this.state.err) return (
          <div className="login-container"><div className="login-box">
            <i className="fas fa-triangle-exclamation" style={{ fontSize: 40, color: 'var(--danger)' }}></i>
            <h2>Something broke</h2>
            <button className="btn btn-primary" onClick={() => location.reload()}><i className="fas fa-rotate"></i> Reload</button>
          </div></div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>

</html>
