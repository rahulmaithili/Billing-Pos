    // --- Records View (DataTable CRUD) ---


function RecordsView({ user, role }) {
      const [showModal, setShowModal] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [reloadKey, setReloadKey] = useState(0);
      const [filters, setFilters] = useState({ dateFrom: '', dateTo: '', active: '', addedBy: '', customerType: '' });
      const [load, setLoad] = useState('');
      const tableInstanceRef = useRef(null);
      const searchFnRef = useRef(null); // our own global-search predicate - removed by identity, never blind-pop another view's
      const [viewCust, setViewCust] = useState(null);

      const { loading, data, err } = useFetch(() => fbGetRecords(), [reloadKey]);
      const records = useMemo(() => (data && data.success ? data.data : []), [data]);
      const reload = () => setReloadKey(k => k + 1);
      window.refreshRecords = reload;

      const byId = useMemo(() => records.reduce((m, r) => (m[r.id] = r, m), {}), [records]);
      const uniqueUsers = useMemo(() => [...new Set(records.map(r => r.addedBy).filter(Boolean))], [records]);
      const openEdit = useCallback((id) => { setEditingId(id); setShowModal(true); }, []);

      useEffect(() => {
        if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load records' });
      }, [err, data]);

      useEffect(() => {
        if (loading) return;
        let table = tableInstanceRef.current;
        if (table) {
          table.clear().rows.add(records).draw(false);
        } else {
          table = $('#recordsTable').DataTable({
            data: records,
            columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
            createdRow: (row, d) => { if (!d.active) $(row).addClass('row-muted'); }, // inactive customers dimmed
            columns: [
              { data: 'id', title: 'ID', render: (d, t) => t === 'display' ? d.slice(-6).toUpperCase() : d },
              { data: 'name', title: 'Name', render: (d, t, row) => t === 'display' ? esc(d) + (row.company ? `<div class="cell-sub">${esc(row.company)}</div>` : '') : d },
              { data: 'phone', title: 'Phone', render: (d, t) => t === 'display' ? esc(d || '') : d },
              { data: 'customerType', title: 'Type', render: (d, t) => t === 'display' ? '<span class="type-chip">' + esc(d || 'Retail') + '</span>' : d },
              { data: 'category', title: 'Group', render: (d, t) => t === 'display' ? esc(d || '') : d },
              { data: 'amount', title: 'Balance', render: (d, t) => t === 'display' ? money(d) : d },
              { data: 'active', title: 'Active', render: (d, t, row) => t === 'display' ? `<input type="checkbox" ${d ? 'checked' : ''} class="toggle" onchange="toggleActive('${row.id}', this.checked ? 1 : 0)">` : d },
              { data: 'createdAt', title: 'Created', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
              { data: null, title: 'Actions', orderable: false, render: () => `<button class="action-icon" data-action="view" title="View"><i class="fas fa-eye"></i></button><button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>` + (role === 'Admin' ? `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` : '') }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[7, 'desc']]
          });
          tableInstanceRef.current = table;
        }
        $('#recordsTable').off('click', '.action-icon').on('click', '.action-icon', function () {
          const id = table.row($(this).parents('tr')).data().id;
          const act = $(this).data('action');
          if (act === 'view') setViewCust(byId[id]);
          else if (act === 'edit') openEdit(id);
          else handleDelete(byId[id]);
        });
      }, [loading, records, role]);

      useEffect(() => () => {
        const ext = $.fn.dataTable.ext.search;
        const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1); // stop the filter leaking into other views' tables
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) { } }
      }, []);

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;
        const ext = $.fn.dataTable.ext.search;
        const prev = ext.indexOf(searchFnRef.current); if (prev !== -1) ext.splice(prev, 1); // replace our own predicate only
        const fn = (settings, dataRow, dataIndex) => {
          const rec = records[dataIndex];
          if (!rec) return true;
          const created = new Date(rec.createdAt);
          const from = filters.dateFrom ? new Date(filters.dateFrom) : null;
          const to = filters.dateTo ? new Date(filters.dateTo + 'T23:59:59') : null;
          if (from && created < from) return false;
          if (to && created > to) return false;
          if (filters.active !== '' && Boolean(rec.active) !== (filters.active === '1')) return false;
          if (filters.addedBy && rec.addedBy !== filters.addedBy) return false;
          if (filters.customerType && (rec.customerType || 'Retail') !== filters.customerType) return false;
          return true;
        };
        searchFnRef.current = fn; ext.push(fn);
        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ dateFrom: '', dateTo: '', active: '', addedBy: '', customerType: '' });
        const ext = $.fn.dataTable.ext.search;
        const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1);
        searchFnRef.current = null;
        if (tableInstanceRef.current) tableInstanceRef.current.draw();
      };

      useEffect(() => { if (tableInstanceRef.current && records.length > 0) applyFilters(); }, [filters, records]);

      const handleSave = async (formData) => {
        setLoad(editingId ? 'Updating record...' : 'Saving record...');
        const result = editingId ? await fbUpdateRecord(editingId, formData, user) : await fbAddRecord(formData, user);
        setLoad('');
        if (result.success) {
          setShowModal(false); setEditingId(null);
          Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
          reload();
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        }
      };

      const handleDelete = (record) => {
        Swal.fire({ icon: 'warning', title: 'Delete?', text: 'This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
          if (!result.isConfirmed) return;
          setLoad('Deleting record...');
          const r = await fbDeleteRecord(record.id, record.name, user);
          setLoad('');
          if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
          else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
        });
      };

      return (
        <div className="data-section">
          {load && <TopLoadingBar />}
          <div className="section-header">
            <h2><i className="fas fa-address-book"></i> Customers</h2>
            <div style={{ display: 'flex', gap: '10px' }}><RefreshBtn onClick={reload} /><button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Customer</button></div>
          </div>
          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date From</label><input type="date" className="filter-input" value={filters.dateFrom} onChange={(e) => setFilters(f => ({ ...f, dateFrom: e.target.value }))} /></div>
                <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date To</label><input type="date" className="filter-input" value={filters.dateTo} onChange={(e) => setFilters(f => ({ ...f, dateTo: e.target.value }))} /></div>
                <SearchableDropdown label="Active" icon="fas fa-check-circle" options={ACTIVE_OPTS} value={filters.active} onChange={(val) => setFilters(f => ({ ...f, active: val }))} placeholder="All Customers" />
                <SearchableDropdown label="Customer Type" icon="fas fa-user-group" options={CUSTOMER_TYPE_OPTS} value={filters.customerType} onChange={(val) => setFilters(f => ({ ...f, customerType: val }))} placeholder="All Types" />
                <SearchableDropdown label="Added By" icon="fas fa-user" options={uniqueUsers.map(u => ({ value: u, label: u }))} value={filters.addedBy} onChange={(val) => setFilters(f => ({ ...f, addedBy: val }))} placeholder="All Users" />
              </div>
            </div>
          )}
          {loading && <TableSkeleton rows={8} columns={8} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="recordsTable" className="display" style={{ width: '100%' }}></table>
            {records.length > 0 && <SummaryBar items={[{ label: 'Customers', value: records.length }, { label: 'Active', value: records.filter(r => r.active).length }, { label: 'Total Balance', value: money(records.reduce((s, r) => s + Number(r.amount || 0), 0)) }]} />}
          </div>
          {viewCust && <CustomerHubModal customer={viewCust} onClose={() => setViewCust(null)} />}
          {showModal && <RecordModal record={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
        </div>
      );
    }

    // --- Product Modal (Add/Edit) ---
    function ProductModal({ product, onClose, onSave }) {
      const catOpts = useCategoryOpts();
      const { settings } = useConfig();
      const [formData, setFormData] = useState({
        name: product?.name || '', category: product?.category || '', price: product?.price ?? '',
        cost: product?.cost ?? '', reorderLevel: product?.reorderLevel ?? '', unit: product?.unit || '',
        barcode: product?.barcode || '', brand: product?.brand || '', supplier: product?.supplier || '',
        taxRate: product?.taxRate ?? '', status: product?.status || 'active',
        wholesalePrice: product?.wholesalePrice ?? '', mrp: product?.mrp ?? '',
        maxStock: product?.maxStock ?? '', reorderQty: product?.reorderQty ?? '',
        location: product?.location || '', batchNo: product?.batchNo || '', expiryDate: product?.expiryDate || '',
        imageUrl: product?.imageUrl || '', description: product?.description || ''
      });
      const [saving, setSaving] = useState(false);
      const num = (v) => Number(v) || 0;

      const submit = async (e) => {
        e.preventDefault();
        setSaving(true);
        // blank tax rate -> null so POS inherits the store default; explicit 0 stays 0 (tax-exempt)
        await onSave({
          ...formData,
          price: num(formData.price), cost: num(formData.cost), reorderLevel: num(formData.reorderLevel),
          taxRate: formData.taxRate === '' ? null : num(formData.taxRate), wholesalePrice: num(formData.wholesalePrice), mrp: num(formData.mrp),
          maxStock: num(formData.maxStock), reorderQty: num(formData.reorderQty),
          status: formData.status || 'active'
        });
        setSaving(false); // re-enable on failed save (parent keeps modal open)
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-box"></i> {product ? 'Edit' : 'Add'} Product</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={submit}>
                <div className="form-group">
                  <label><i className="fas fa-barcode"></i> SKU</label>
                  <input type="text" value={product ? product.sku : 'Auto-generated on save'} disabled />
                </div>
                {formData.imageUrl ? <div className="prod-img-preview"><img src={formData.imageUrl} alt="" onError={(e) => { e.target.style.display = 'none'; }} /></div> : null}
                <div className="form-grid">
                  <div className="form-group"><label>Product Name *</label><input type="text" value={formData.name} onChange={(e) => setFormData(p => ({ ...p, name: e.target.value }))} required /></div>
                  <SearchableDropdown label="Category" icon="fas fa-tag" options={catOpts} value={formData.category} onChange={(val) => setFormData(p => ({ ...p, category: val }))} placeholder="Select category..." required={true} />
                  <div className="form-group"><label>Brand</label><input type="text" value={formData.brand} onChange={(e) => setFormData(p => ({ ...p, brand: e.target.value }))} /></div>
                  <div className="form-group"><label><i className="fas fa-barcode"></i> Barcode (UPC/EAN)</label><input type="text" placeholder="Scan or type retail barcode" value={formData.barcode} onChange={(e) => setFormData(p => ({ ...p, barcode: e.target.value }))} /></div>
                  <div className="form-group"><label>Selling Price *</label><input type="number" step="0.01" min="0" value={formData.price} onChange={(e) => setFormData(p => ({ ...p, price: e.target.value }))} required /></div>
                  <div className="form-group"><label>Cost</label><input type="number" step="0.01" min="0" value={formData.cost} onChange={(e) => setFormData(p => ({ ...p, cost: e.target.value }))} /></div>
                  <div className="form-group"><label>Wholesale Price</label><input type="number" step="0.01" min="0" value={formData.wholesalePrice} onChange={(e) => setFormData(p => ({ ...p, wholesalePrice: e.target.value }))} /></div>
                  <div className="form-group"><label>MRP / List Price</label><input type="number" step="0.01" min="0" value={formData.mrp} onChange={(e) => setFormData(p => ({ ...p, mrp: e.target.value }))} /></div>
                  <div className="form-group"><label>Tax Rate % {settings?.taxRate ? `(default ${settings.taxRate}%)` : ''}</label><input type="number" step="0.01" min="0" placeholder="blank = use default" value={formData.taxRate} onChange={(e) => setFormData(p => ({ ...p, taxRate: e.target.value }))} /></div>
                  <div className="form-group"><label>Unit</label><input type="text" placeholder="pcs, box, kg..." value={formData.unit} onChange={(e) => setFormData(p => ({ ...p, unit: e.target.value }))} /></div>
                  <div className="form-group"><label>Reorder Level *</label><input type="number" step="1" min="0" value={formData.reorderLevel} onChange={(e) => setFormData(p => ({ ...p, reorderLevel: e.target.value }))} required /></div>
                  <div className="form-group"><label>Max Stock</label><input type="number" step="1" min="0" value={formData.maxStock} onChange={(e) => setFormData(p => ({ ...p, maxStock: e.target.value }))} /></div>
                  <div className="form-group"><label>Reorder Qty</label><input type="number" step="1" min="0" placeholder="fixed restock amount" value={formData.reorderQty} onChange={(e) => setFormData(p => ({ ...p, reorderQty: e.target.value }))} /></div>
                  <div className="form-group"><label>Supplier</label><input type="text" value={formData.supplier} onChange={(e) => setFormData(p => ({ ...p, supplier: e.target.value }))} /></div>
                  <div className="form-group"><label><i className="fas fa-location-dot"></i> Location / Bin</label><input type="text" placeholder="Aisle-Shelf-Bin" value={formData.location} onChange={(e) => setFormData(p => ({ ...p, location: e.target.value }))} /></div>
                  <div className="form-group"><label>Batch / Lot No</label><input type="text" value={formData.batchNo} onChange={(e) => setFormData(p => ({ ...p, batchNo: e.target.value }))} /></div>
                  <div className="form-group"><label><i className="fas fa-calendar-xmark"></i> Expiry Date</label><input type="date" value={formData.expiryDate} onChange={(e) => setFormData(p => ({ ...p, expiryDate: e.target.value }))} /></div>
                  <SearchableDropdown label="Status" icon="fas fa-toggle-on" options={STATUS_OPTS} value={formData.status} onChange={(val) => setFormData(p => ({ ...p, status: val }))} placeholder="Active" />
                </div>
                <div className="form-group"><label><i className="fas fa-image"></i> Image URL</label><input type="text" placeholder="https://..." value={formData.imageUrl} onChange={(e) => setFormData(p => ({ ...p, imageUrl: e.target.value }))} /></div>
                <div className="form-group"><label>Description</label><textarea rows="2" value={formData.description} onChange={(e) => setFormData(p => ({ ...p, description: e.target.value }))}></textarea></div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- QR Modal (single product view) ---
    function QRModal({ product, onClose }) {
      const previewRef = useRef(null);
      const printRef = useRef(null);

      useEffect(() => {
        if (!product) return;
        QRCode.toCanvas(previewRef.current, product.id, { width: 220, margin: 1, color: { dark: '#001f3f', light: '#ffffff' } }, () => { });
        QRCode.toCanvas(printRef.current, product.id, { width: 300, margin: 0 }, () => { });
      }, [product]);

      if (!product) return null;

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{ maxWidth: '380px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-qrcode"></i> Product QR Code</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body" style={{ textAlign: 'center' }}>
              <canvas ref={previewRef}></canvas>
              <p style={{ marginTop: '14px', fontWeight: 700, color: 'var(--navy-primary)', fontSize: '16px', letterSpacing: '.5px' }}>{product.sku}</p>
              <p style={{ color: '#999', fontSize: '13px', marginTop: '4px' }}>{product.name}</p>
              <div className="form-actions" style={{ justifyContent: 'center', marginTop: '24px' }}>
                <button className="btn btn-primary" onClick={() => window.print()}><i className="fas fa-print"></i> Print Label</button>
                <button className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Close</button>
              </div>
            </div>
            {/* print-only mirror, hidden on screen, shown via .qr-label-print in @media print */}
            <div className="qr-print-stage">
              <div className="qr-label-print">
                <canvas ref={printRef}></canvas>
                <div className="qr-label-sku">{product.sku}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Bulk QR label printing ---
    function PrintAllLabels({ products, onDone }) {
      const canvasRefs = useRef({});

      useEffect(() => {
        let cancelled = false;
        Promise.all(products.map(p => QRCode.toCanvas(canvasRefs.current[p.id], p.id, { width: 300, margin: 0 })))
          .then(() => { if (!cancelled) window.print(); })
          .catch((e) => console.error('qr render failed', e));
        return () => { cancelled = true; };
      }, [products]);

      useEffect(() => {
        const afterPrint = () => onDone();
        window.addEventListener('afterprint', afterPrint);
        return () => window.removeEventListener('afterprint', afterPrint);
      }, [onDone]);

      return (
        <div className="qr-print-stage">
          {products.map(p => (
            <div className="qr-label-print" key={p.id}>
              <canvas ref={(el) => { canvasRefs.current[p.id] = el; }}></canvas>
              <div className="qr-label-sku">{p.sku}</div>
            </div>
          ))}
        </div>
      );
    }

    // --- Reorder report (print only - lists everything at/below reorder level) ---
    function ReorderReportPrint({ rows, onDone }) {
      useEffect(() => { window.print(); }, []);
      useEffect(() => {
        const afterPrint = () => onDone();
        window.addEventListener('afterprint', afterPrint);
        return () => window.removeEventListener('afterprint', afterPrint);
      }, [onDone]);

      return (
        <div className="reorder-report-print">
          <div className="rr-header">
            <img src={LOGO_URL} alt="" className="rr-logo" />
            <div>
              <div className="rr-title">Reorder Report</div>
              <div className="rr-sub">Generated {formatDateForDisplay(new Date().toISOString())}</div>
            </div>
          </div>
          <table className="rr-table">
            <thead><tr><th>Name</th><th>SKU</th><th>Category</th><th>Qty On Hand</th><th>Reorder Level</th><th>Suggested Reorder</th></tr></thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.id}>
                  <td>{r.name}</td><td>{r.sku}</td><td>{r.category}</td><td>{r.qtyOnHand}</td><td>{r.reorderLevel}</td>
                  <td>{suggestedReorder(r, r.qtyOnHand)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // --- Products View (DataTable CRUD + QR) ---


function ProductsView({ user, role }) {
      const catOpts = useCategoryOpts();
      const [showModal, setShowModal] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [qrProductId, setQrProductId] = useState(null);
      const [viewProd, setViewProd] = useState(null);
      const [printAll, setPrintAll] = useState(false);
      const [printRows, setPrintRows] = useState([]);
      const [showReorderReport, setShowReorderReport] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [filters, setFilters] = useState({ category: '', lowStock: '', status: '' });
      const [pipeStage, setPipeStage] = useState('all');
      const [showImport, setShowImport] = useState(false);
      const [load, setLoad] = useState('');
      const tableInstanceRef = useRef(null);
      const searchFnRef = useRef(null); // our own global-search predicate - removed by identity, never blind-pop another view's

      const { loading, data, err } = useFetch(() => Promise.all([fbGetProducts(), fbGetStockMovements()]), [reloadKey]);
      const products = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
      const movements = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
      const reload = () => setReloadKey(k => k + 1);

      const tableData = useMemo(() => products.map(p => Object.assign({}, p, { qtyOnHand: computeQtyOnHand(p.id, movements) })), [products, movements]);
      const byId = useMemo(() => products.reduce((m, p) => (m[p.id] = p, m), {}), [products]);
      const openEdit = useCallback((id) => { setEditingId(id); setShowModal(true); }, []);

      useEffect(() => {
        if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load products' });
      }, [err, data]);

      useEffect(() => {
        if (loading) return;
        let table = tableInstanceRef.current;
        if (table) {
          table.clear().rows.add(tableData).draw(false);
        } else {
          table = $('#productsTable').DataTable({
            data: tableData,
            columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
            createdRow: (row, d) => { if (Number(d.qtyOnHand) <= Number(d.reorderLevel || 0)) $(row).addClass('row-warn'); }, // low stock
            columns: [
              { data: 'imageUrl', title: '', orderable: false, render: (d, t) => t === 'display' ? (d ? `<img class="prod-thumb" src="${esc(d)}" onerror="this.style.visibility='hidden'">` : `<span class="prod-thumb empty"><i class="fas fa-box"></i></span>`) : '' },
              { data: 'name', title: 'Name', render: (d, t, row) => t === 'display' ? esc(d) + (row.brand ? `<div class="cell-sub">${esc(row.brand)}</div>` : '') : d },
              { data: 'sku', title: 'SKU', render: (d, t) => t === 'display' ? '<code>' + esc(d) + '</code>' : d },
              { data: 'barcode', title: 'Barcode', render: (d, t) => t === 'display' ? (d ? '<code>' + esc(d) + '</code>' : '<span style="color:#bbb">—</span>') : (d || '') },
              { data: 'category', title: 'Category', render: (d, t) => t === 'display' ? esc(d) : d },
              { data: 'price', title: 'Price', render: (d, t) => t === 'display' ? money(d) : d },
              { data: 'qtyOnHand', title: 'Qty On Hand', render: (d, t, row) => t === 'display' ? (Number(d) <= Number(row.reorderLevel || 0) ? '<span class="status-badge status-inactive">' + d + '</span>' : d) : d },
              { data: 'reorderLevel', title: 'Reorder Level' },
              { data: 'status', title: 'Status', render: (d, t) => t === 'display' ? (d === 'discontinued' ? '<span class="status-badge status-inactive">Discontinued</span>' : '<span class="status-badge status-active">Active</span>') : (d || 'active') },
              { data: null, title: 'Actions', orderable: false, render: () => `<button class="action-icon" data-action="view" title="View"><i class="fas fa-eye"></i></button><button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button><button class="action-icon qr-icon" data-action="qr" title="QR"><i class="fas fa-qrcode"></i></button>` + (role === 'Admin' ? `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` : '') }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[1, 'asc']]
          });
          tableInstanceRef.current = table;
        }
        $('#productsTable').off('click', '.action-icon').on('click', '.action-icon', function () {
          const id = table.row($(this).parents('tr')).data().id;
          const action = $(this).data('action');
          if (action === 'view') setViewProd(byId[id]);
          else if (action === 'edit') openEdit(id);
          else if (action === 'qr') setQrProductId(id);
          else handleDelete(byId[id]);
        });
      }, [loading, tableData, role]);

      useEffect(() => () => {
        const ext = $.fn.dataTable.ext.search;
        const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1); // stop the filter leaking into other views' tables
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) { } }
      }, []);

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;
        const ext = $.fn.dataTable.ext.search;
        const prev = ext.indexOf(searchFnRef.current); if (prev !== -1) ext.splice(prev, 1); // replace our own predicate only
        const fn = (settings, dataRow, dataIndex) => {
          const p = tableData[dataIndex];
          if (!p) return true;
          if (filters.category && p.category !== filters.category) return false;
          if (filters.lowStock === '1' && !(Number(p.qtyOnHand) <= Number(p.reorderLevel || 0))) return false;
          if (filters.status && (p.status || 'active') !== filters.status) return false;
          return true;
        };
        searchFnRef.current = fn; ext.push(fn);
        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ category: '', lowStock: '', status: '' });
        setPipeStage('all');
        const ext = $.fn.dataTable.ext.search;
        const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1);
        searchFnRef.current = null;
        if (tableInstanceRef.current) tableInstanceRef.current.draw();
      };

      useEffect(() => { if (tableInstanceRef.current && tableData.length > 0) applyFilters(); }, [filters, tableData]);

      const isFiltered = !!(filters.category || filters.lowStock || filters.status);
      const reorderRows = useMemo(() => tableData.filter(p => Number(p.qtyOnHand) <= Number(p.reorderLevel || 0)), [tableData]);
      const stockValue = useMemo(() => tableData.reduce((s, p) => s + Number(p.qtyOnHand || 0) * (Number(p.cost) || 0), 0), [tableData]);

      const pipelineStages = useMemo(() => [
        { k: 'all', label: 'All Products', n: tableData.length, tone: 'var(--navy-primary)' },
        { k: 'active', label: 'Active', n: tableData.filter(p => (p.status || 'active') === 'active').length, tone: 'var(--success)' },
        { k: 'low', label: 'Low Stock Alert', n: reorderRows.length, tone: 'var(--warning)' },
        { k: 'discontinued', label: 'Discontinued', n: tableData.filter(p => p.status === 'discontinued').length, tone: 'var(--danger)' }
      ], [tableData, reorderRows.length]);

      const onPickStage = (k) => {
        setPipeStage(k);
        if (k === 'all') setFilters(f => ({ ...f, lowStock: '', status: '' }));
        else if (k === 'active') setFilters(f => ({ ...f, lowStock: '', status: 'active' }));
        else if (k === 'low') setFilters(f => ({ ...f, lowStock: '1', status: '' }));
        else if (k === 'discontinued') setFilters(f => ({ ...f, lowStock: '', status: 'discontinued' }));
      };

      const handlePrintLabels = () => {
        const dt = tableInstanceRef.current;
        setPrintRows(dt ? dt.rows({ search: 'applied' }).data().toArray() : tableData);
        setPrintAll(true);
      };

      const handleSave = async (formData) => {
        setLoad(editingId ? 'Updating product...' : 'Saving product...');
        const result = editingId ? await fbUpdateProduct(editingId, formData, user) : await fbAddProduct(formData, user);
        setLoad('');
        if (result.success) {
          setShowModal(false); setEditingId(null);
          Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
          reload();
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        }
      };

      const handleDelete = (product) => {
        Swal.fire({ icon: 'warning', title: 'Delete?', text: 'This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
          if (!result.isConfirmed) return;
          setLoad('Deleting product...');
          const r = await fbDeleteProduct(product.id, product.name, user);
          setLoad('');
          if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
          else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
        });
      };

      return (
        <div className="data-section">
          {load && <TopLoadingBar />}
          <div className="section-header">
            <h2><i className="fas fa-boxes-stacked"></i> Products</h2>
            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
              <RefreshBtn onClick={reload} />
              <button className="btn btn-secondary" onClick={() => setShowImport(true)}><i className="fas fa-file-import"></i> Import CSV</button>
              <button className="btn btn-secondary" onClick={() => setShowReorderReport(true)} disabled={reorderRows.length === 0}><i className="fas fa-triangle-exclamation"></i> Print Reorder Report</button>
              <button className="btn btn-secondary" onClick={handlePrintLabels} disabled={products.length === 0}><i className="fas fa-print"></i> {isFiltered ? 'Print Filtered Labels' : 'Print All QR Labels'}</button>
              <button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Product</button>
            </div>
          </div>
          {!loading && (
            <Pipeline stages={pipelineStages} value={pipeStage} onPick={onPickStage} />
          )}
          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <SearchableDropdown label="Category" icon="fas fa-tag" options={catOpts} value={filters.category} onChange={(val) => setFilters(f => ({ ...f, category: val }))} placeholder="All Categories" />
                <SearchableDropdown label="Stock Status" icon="fas fa-triangle-exclamation" options={LOW_STOCK_OPTS} value={filters.lowStock} onChange={(val) => setFilters(f => ({ ...f, lowStock: val }))} placeholder="All Stock Levels" />
                <SearchableDropdown label="Status" icon="fas fa-toggle-on" options={PRODUCT_STATUS_FILTER} value={filters.status} onChange={(val) => setFilters(f => ({ ...f, status: val }))} placeholder="All Statuses" />
              </div>
            </div>
          )}
          {loading && <TableSkeleton rows={8} columns={7} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="productsTable" className="display" style={{ width: '100%' }}></table>
            {products.length > 0 && <SummaryBar items={[{ label: 'Products', value: products.length }, { label: 'Stock Value', value: money(stockValue) }, { label: 'Low Stock', value: reorderRows.length }]} />}
          </div>
          {showModal && <ProductModal product={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
          {viewProd && <ProductHubModal product={viewProd} onClose={() => setViewProd(null)} />}
          {qrProductId && <QRModal product={byId[qrProductId]} onClose={() => setQrProductId(null)} />}
          {printAll && <PrintAllLabels products={printRows} onDone={() => setPrintAll(false)} />}
          {showReorderReport && <ReorderReportPrint rows={reorderRows} onDone={() => setShowReorderReport(false)} />}
          {showImport && <ProductImportModal user={user} onClose={() => setShowImport(false)} onDone={() => { setShowImport(false); reload(); }} />}
        </div>
      );
    }

    // --- Stock Movement Modal (Stock In / Stock Out - same modal, fixed type prop) ---
    function StockMovementModal({ type, products, movements, onClose, onSave }) {
      const [productId, setProductId] = useState('');
      const [qty, setQty] = useState('');
      const [reason, setReason] = useState(type === 'out' ? 'Damage' : 'Purchase');
      const [reference, setReference] = useState('');
      const [unitCost, setUnitCost] = useState('');
      const [updateCost, setUpdateCost] = useState(true);
      const [supplier, setSupplier] = useState('');
      const [batchNo, setBatchNo] = useState('');
      const [expiryDate, setExpiryDate] = useState('');
      const [location, setLocation] = useState('');
      const [notes, setNotes] = useState('');
      const [saving, setSaving] = useState(false);

      const isOut = type === 'out';
      const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
      const selectedProduct = (products || []).find(p => p.id === productId);
      const onHand = useMemo(() => productId ? computeQtyOnHand(productId, movements) : 0, [productId, movements]);

      // prefill cost + location from the product when picked (for IN)
      useEffect(() => { if (selectedProduct && !isOut) { setUnitCost(c => c || (selectedProduct.cost ?? '')); setLocation(l => l || (selectedProduct.location || '')); } }, [productId]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        const q = Number(qty);
        if (!productId) return Swal.fire({ icon: 'warning', title: 'Pick a Product', text: 'Select a product first' });
        if (!Number.isInteger(q) || q < 1) return Swal.fire({ icon: 'warning', title: 'Invalid Quantity', text: 'Quantity must be a whole number, at least 1' });
        if (isOut && q > onHand) {
          const confirm = await Swal.fire({
            icon: 'warning', title: 'Qty On Hand Warning',
            text: `Only ${onHand} unit(s) on hand for this product. This Stock Out will push Qty On Hand to ${onHand - q}. Continue anyway?`,
            showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Continue', cancelButtonText: 'Cancel'
          });
          if (!confirm.isConfirmed) return;
        }
        setSaving(true);
        const move = { productId, type, qty: q, reason, reference: reference.trim() || null, location: location.trim() || null, notes: notes.trim() || null };
        if (!isOut) { move.unitCost = Number(unitCost) || 0; move.supplier = supplier.trim() || null; move.batchNo = batchNo.trim() || null; move.expiryDate = expiryDate || null; move.updateCost = updateCost && Number(unitCost) > 0; }
        await onSave(move, selectedProduct?.name || 'Unknown Product');
        setSaving(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className={`fas ${isOut ? 'fa-arrow-up' : 'fa-arrow-down'}`}></i> Stock {isOut ? 'Out' : 'In'}</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <SearchableDropdown label="Product" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Search product by name or SKU..." required={true} />
                  <div className="form-group"><label>Quantity *</label><input type="number" min="1" step="1" value={qty} onChange={(e) => setQty(e.target.value)} required /></div>
                </div>
                {productId && <p className="stock-onhand-hint">Qty on hand: <strong>{onHand}</strong>{!isOut && Number(qty) > 0 ? ` → ${onHand + Number(qty)}` : ''}</p>}
                <div className="form-grid">
                  <SearchableDropdown label="Reason" icon="fas fa-clipboard-list" options={isOut ? REASON_OUT_OPTS : REASON_IN_OPTS} value={reason} onChange={setReason} placeholder="Select reason..." required={true} />
                  <div className="form-group"><label>Reference</label><input type="text" value={reference} onChange={(e) => setReference(e.target.value)} placeholder="PO / invoice / sale ID" /></div>
                  {!isOut && <div className="form-group"><label>Unit Cost</label><input type="number" min="0" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} /></div>}
                  {!isOut && <div className="form-group"><label>Supplier</label><input type="text" value={supplier} onChange={(e) => setSupplier(e.target.value)} /></div>}
                  {!isOut && <div className="form-group"><label>Batch / Lot No</label><input type="text" value={batchNo} onChange={(e) => setBatchNo(e.target.value)} /></div>}
                  {!isOut && <div className="form-group"><label><i className="fas fa-calendar-xmark"></i> Expiry Date</label><input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} /></div>}
                  <div className="form-group"><label><i className="fas fa-location-dot"></i> Location / Bin</label><input type="text" value={location} onChange={(e) => setLocation(e.target.value)} /></div>
                </div>
                {!isOut && <div className="form-group"><label className="stock-cost-check"><input type="checkbox" checked={updateCost} onChange={(e) => setUpdateCost(e.target.checked)} /> Update product cost to this unit cost</label></div>}
                <div className="form-group"><label>Notes</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)}></textarea></div>
                <div className="form-actions">
                  <button type="submit" className={`btn ${isOut ? 'btn-danger' : 'btn-success'}`} disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Record Stock {isOut ? 'Out' : 'In'}</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- Stock View (ledger DataTable + Stock In / Stock Out buttons) ---
    // --- Bulk Stock In (receiving a supplier delivery in one go) ---
    function BulkStockInModal({ products, onClose, onSave }) {
      const [lines, setLines] = useState([]);
      const [productId, setProductId] = useState('');
      const [qty, setQty] = useState('');
      const [reason, setReason] = useState('');
      const [reference, setReference] = useState('');
      const [saving, setSaving] = useState(false);

      const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
      const byId = useMemo(() => (products || []).reduce((m, p) => (m[p.id] = p, m), {}), [products]);
      const totalQty = useMemo(() => lines.reduce((s, l) => s + l.qty, 0), [lines]);

      const addLine = () => {
        const q = Number(qty);
        if (!productId) return Swal.fire({ icon: 'warning', title: 'Pick a Product', text: 'Select a product first' });
        if (!Number.isInteger(q) || q < 1) return Swal.fire({ icon: 'warning', title: 'Invalid Quantity', text: 'Quantity must be a whole number, at least 1' });
        const product = byId[productId];
        setLines(prev => {
          const existing = prev.find(l => l.productId === productId);
          if (existing) return prev.map(l => l.productId === productId ? { ...l, qty: l.qty + q } : l);
          return [...prev, { productId, name: product.name, sku: product.sku, qty: q }];
        });
        setProductId(''); setQty('');
      };

      const removeLine = (pid) => setLines(prev => prev.filter(l => l.productId !== pid));

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!lines.length) return Swal.fire({ icon: 'warning', title: 'No Items', text: 'Add at least one product line' });
        if (!reason.trim()) return Swal.fire({ icon: 'warning', title: 'Reason Required', text: 'Enter a reason, e.g. Purchase / Supplier Delivery' });
        setSaving(true);
        const batchLines = lines.map(l => ({ productId: l.productId, name: l.name, qty: l.qty, reason: reason.trim(), reference: reference.trim() || null }));
        await onSave(batchLines);
        setSaving(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-truck-ramp-box"></i> Bulk Receive Stock</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <div className="form-grid">
                <SearchableDropdown label="Product" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Search product by name or SKU..." />
                <div className="form-group"><label>Quantity</label><input type="number" min="1" step="1" value={qty} onChange={(e) => setQty(e.target.value)} /></div>
              </div>
              <div className="form-actions" style={{ marginTop: 0, marginBottom: '20px' }}>
                <button type="button" className="btn btn-secondary btn-sm" onClick={addLine}><i className="fas fa-plus"></i> Add Line</button>
              </div>
              {lines.length > 0 && (
                <div className="pos-cart-list" style={{ marginBottom: '20px' }}>
                  {lines.map(l => (
                    <div className="pos-cart-row" key={l.productId}>
                      <div className="pi-name"><strong>{l.name}</strong><small>SKU: {l.sku}</small></div>
                      <div className="pos-line-total">Qty: {l.qty}</div>
                      <button type="button" className="pos-remove-btn" title="Remove line" onClick={() => removeLine(l.productId)}><i className="fas fa-trash"></i></button>
                    </div>
                  ))}
                </div>
              )}
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <div className="form-group"><label>Reason *</label><input type="text" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="e.g. Supplier Delivery, Purchase" required /></div>
                  <div className="form-group"><label>Reference</label><input type="text" value={reference} onChange={(e) => setReference(e.target.value)} placeholder="Optional - e.g. PO number" /></div>
                </div>
                {lines.length > 0 && <p className="stock-onhand-hint">Total units to receive: <strong>{totalQty}</strong></p>}
                <div className="form-actions">
                  <button type="submit" className="btn btn-success" disabled={saving || lines.length === 0}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Receive Stock</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- Stocktake / Adjustment - enter the counted qty, we post the correcting in/out movement ---
    function StockAdjustModal({ products, movements, onClose, onSave }) {
      const [productId, setProductId] = useState('');
      const [counted, setCounted] = useState('');
      const [notes, setNotes] = useState('');
      const [saving, setSaving] = useState(false);
      const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
      const selected = (products || []).find(p => p.id === productId);
      const onHand = useMemo(() => productId ? computeQtyOnHand(productId, movements) : 0, [productId, movements]);
      const diff = counted === '' ? 0 : (Number(counted) - onHand);

      const submit = async (e) => {
        e.preventDefault();
        if (!productId) return Swal.fire({ icon: 'warning', title: 'Pick a Product' });
        if (counted === '' || Number(counted) < 0) return Swal.fire({ icon: 'warning', title: 'Enter counted qty' });
        if (diff === 0) return Swal.fire({ icon: 'info', title: 'No change', text: 'Counted quantity matches on-hand.' });
        setSaving(true);
        await onSave({ productId, type: diff > 0 ? 'in' : 'out', qty: Math.abs(diff), reason: 'Adjustment', reference: 'Stocktake', notes: notes.trim() || `Counted ${counted}, was ${onHand}` }, selected?.name || 'Unknown Product');
        setSaving(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header"><h3><i className="fas fa-scale-balanced"></i> Stocktake / Adjustment</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={submit}>
                <SearchableDropdown label="Product" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Search product..." required={true} />
                {productId && <p className="stock-onhand-hint">System on hand: <strong>{onHand}</strong></p>}
                <div className="form-grid">
                  <div className="form-group"><label>Counted Quantity *</label><input type="number" min="0" step="1" value={counted} onChange={(e) => setCounted(e.target.value)} required /></div>
                  <div className="form-group"><label>Adjustment</label><input type="text" value={productId && counted !== '' ? (diff > 0 ? '+' + diff + ' (Stock In)' : diff < 0 ? diff + ' (Stock Out)' : 'No change') : '-'} disabled /></div>
                </div>
                <div className="form-group"><label>Notes</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Reason for the variance (damage, miscount...)"></textarea></div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Posting...</> : <><i className="fas fa-save"></i> Post Adjustment</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }


    // --- Categories Management View ---
    function CategoriesView({ user, role }) {
      const [reloadKey, setReloadKey] = useState(0);
      const [showModal, setShowModal] = useState(false);
      const [editingCat, setEditingCat] = useState(null);
      const [formData, setFormData] = useState({ name: '', icon: 'fa-tag', description: '' });
      const [searchQuery, setSearchQuery] = useState('');
      const [saving, setSaving] = useState(false);

      const { loading: loadingCats, data: catsData } = useFetch(() => fbGetCategories(), [reloadKey]);
      const categories = useMemo(() => (catsData && catsData.success ? catsData.data : []), [catsData]);

      const { loading: loadingProds, data: prodsData } = useFetch(() => fbGetProducts(), [reloadKey]);
      const products = useMemo(() => (prodsData && prodsData.success ? prodsData.data : []), [prodsData]);

      // Count products per category
      const productCounts = useMemo(() => {
        const counts = {};
        products.forEach(p => {
          const c = p.category ? String(p.category).trim() : 'Uncategorized';
          counts[c] = (counts[c] || 0) + 1;
        });
        return counts;
      }, [products]);

      // Filter categories by search
      const filteredCategories = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return categories;
        return categories.filter(c => (c.name && c.name.toLowerCase().includes(q)) || (c.description && c.description.toLowerCase().includes(q)));
      }, [categories, searchQuery]);

      const openAddModal = () => {
        setEditingCat(null);
        setFormData({ name: '', icon: 'fa-mug-hot', description: '' });
        setShowModal(true);
      };

      const openEditModal = (cat) => {
        setEditingCat(cat);
        setFormData({ name: cat.name || '', icon: cat.icon || 'fa-tag', description: cat.description || '' });
        setShowModal(true);
      };

      const handleSave = async (e) => {
        e.preventDefault();
        const nm = formData.name.trim();
        if (!nm) {
          Swal.fire({ icon: 'warning', title: 'Category Name Required', text: 'Please enter a name for the category.' });
          return;
        }

        setSaving(true);
        if (editingCat) {
          const res = await fbUpdateCategory(editingCat.id, { name: nm, icon: formData.icon, description: formData.description }, user);
          setSaving(false);
          if (!res.success) {
            Swal.fire({ icon: 'error', title: 'Update Failed', text: res.message || 'Could not update category.' });
            return;
          }
          Swal.fire({ icon: 'success', title: 'Category Updated', text: `"${nm}" has been updated.`, timer: 1500, showConfirmButton: false });
        } else {
          const res = await fbAddCategory(nm, user);
          setSaving(false);
          if (!res.success) {
            Swal.fire({ icon: 'error', title: 'Failed to Add', text: res.message || 'Could not add category.' });
            return;
          }
          Swal.fire({ icon: 'success', title: 'Category Created', text: `Category "${nm}" is ready for products & POS menu!`, timer: 1500, showConfirmButton: false });
        }

        setShowModal(false);
        setReloadKey(k => k + 1);
      };

      const handleDelete = async (cat) => {
        const count = productCounts[cat.name] || 0;
        let warningHtml = `Are you sure you want to delete category <strong>"${cat.name}"</strong>?`;
        if (count > 0) {
          warningHtml += `<br><br><span style="color: #ea4335; font-size: 13px;">⚠️ Note: ${count} product(s) are currently assigned to this category.</span>`;
        }

        const confirm = await Swal.fire({
          title: 'Delete Category?',
          html: warningHtml,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Yes, delete it'
        });

        if (confirm.isConfirmed) {
          const res = await fbDeleteCategory(cat.id, cat.name, user);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Deleted', text: `Category "${cat.name}" removed.`, timer: 1400, showConfirmButton: false });
            setReloadKey(k => k + 1);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: res.message || 'Could not delete category.' });
          }
        }
      };

      const iconOptions = [
        { label: 'Hot Coffee', icon: 'fa-mug-hot' },
        { label: 'Cold Drink / Juice', icon: 'fa-blender' },
        { label: 'Burger & Snacks', icon: 'fa-burger' },
        { label: 'Pizza & Meals', icon: 'fa-pizza-slice' },
        { label: 'Bakery & Cake', icon: 'fa-cake-candles' },
        { label: 'Ice Cream & Dessert', icon: 'fa-ice-cream' },
        { label: 'Beverage / Water', icon: 'fa-bottle-water' },
        { label: 'General / Tag', icon: 'fa-tag' },
        { label: 'Box / Package', icon: 'fa-box' }
      ];

      return (
        <div className="data-section">
          {/* Header */}
          <div className="section-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
            <div>
              <h2><i className="fas fa-layer-group" style={{ color: 'var(--navy-accent)', marginRight: 10 }}></i> Categories Management</h2>
              <p style={{ margin: '4px 0 0', color: '#64748b', fontSize: 13 }}>Create and organize store product categories for the POS Billing Terminal and Catalog</p>
            </div>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <button type="button" className="btn btn-secondary" onClick={() => setReloadKey(k => k + 1)} title="Refresh Categories">
                <i className="fas fa-rotate"></i> Refresh
              </button>
              <button type="button" className="btn btn-primary" onClick={openAddModal} style={{ fontWeight: 700 }}>
                <i className="fas fa-plus"></i> + Add Category
              </button>
            </div>
          </div>

          {/* Stats Bar */}
          <div className="dash-stats-grid" style={{ marginBottom: 20 }}>
            <div className="stat-card">
              <div className="stat-icon" style={{ background: '#e0f2fe', color: '#0284c7' }}><i className="fas fa-layer-group"></i></div>
              <div className="stat-content">
                <div className="stat-value">{categories.length}</div>
                <div className="stat-label">Total Categories</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{ background: '#dcfce7', color: '#16a34a' }}><i className="fas fa-box-open"></i></div>
              <div className="stat-content">
                <div className="stat-value">{products.length}</div>
                <div className="stat-label">Products Assigned</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{ background: '#fef3c7', color: '#b45309' }}><i className="fas fa-cash-register"></i></div>
              <div className="stat-content">
                <div className="stat-value">{categories.length > 0 ? 'Live in POS' : 'No Categories'}</div>
                <div className="stat-label">POS Menu Status</div>
              </div>
            </div>
          </div>

          {/* Search Bar */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, gap: 12 }}>
            <div style={{ position: 'relative', flex: 1, maxWidth: 360 }}>
              <i className="fas fa-search" style={{ position: 'absolute', left: 12, top: 12, color: '#94a3b8', fontSize: 14 }}></i>
              <input
                type="text"
                placeholder="Search categories..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                style={{ width: '100%', paddingLeft: 36, paddingRight: 12, height: 38, borderRadius: 'var(--r-sm, 8px)', border: '1px solid #cbd5e1' }}
              />
            </div>
            <div style={{ fontSize: 13, color: '#64748b' }}>
              Showing <strong>{filteredCategories.length}</strong> of <strong>{categories.length}</strong> categories
            </div>
          </div>

          {/* Categories Grid / List */}
          {loadingCats ? (
            <TableSkeleton rows={4} columns={4} />
          ) : filteredCategories.length === 0 ? (
            <div style={{ background: '#ffffff', borderRadius: 'var(--r-md, 12px)', border: '1px solid #e2e8f0', padding: 40, textAlign: 'center' }}>
              <i className="fas fa-folder-open" style={{ fontSize: 44, color: '#cbd5e1', marginBottom: 12, display: 'block' }}></i>
              <h3 style={{ margin: '0 0 6px', color: '#334155', fontSize: 17 }}>No Categories Found</h3>
              <p style={{ margin: '0 0 16px', color: '#64748b', fontSize: 13 }}>Create your first category to group drinks, food items, and retail products.</p>
              <button type="button" className="btn btn-primary" onClick={openAddModal}>
                <i className="fas fa-plus"></i> Create Category
              </button>
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>
              {filteredCategories.map(cat => {
                const count = productCounts[cat.name] || 0;
                const iconClass = cat.icon || 'fa-tag';
                return (
                  <div
                    key={cat.id}
                    style={{
                      background: '#ffffff',
                      borderRadius: 'var(--r-md, 12px)',
                      border: '1.5px solid #e2e8f0',
                      padding: 16,
                      boxShadow: '0 2px 8px rgba(0,0,0,0.03)',
                      display: 'flex',
                      flexDirection: 'column',
                      justifyContent: 'space-between',
                      transition: 'all .2s ease'
                    }}
                  >
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                        <div style={{ width: 44, height: 44, borderRadius: 'var(--r-md, 12px)', background: '#e0f2fe', color: '#0284c7', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20 }}>

                          {count} {count === 1 ? 'Product' : 'Products'}
                        </span>
                      </div>
                      <h3 style={{ margin: '0 0 4px', fontSize: 16, color: '#0f172a', fontWeight: 700 }}>{cat.name}</h3>
                      {cat.description && (
                        <p style={{ margin: '0 0 12px', fontSize: 12.5, color: '#64748b', lineHeight: 1.4 }}>{cat.description}</p>

                      <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 6 }}>

                        <i className="fas fa-trash"></i> Delete
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Add / Edit Category Modal */}

function StockView({ user, role }) {
      const [modalType, setModalType] = useState(null);
      const [showBulkIn, setShowBulkIn] = useState(false);
      const [showAdjust, setShowAdjust] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [load, setLoad] = useState('');
      const tableInstanceRef = useRef(null);

      const { loading, data, err } = useFetch(() => Promise.all([fbGetStockMovements(), fbGetProducts()]), [reloadKey]);
      const movements = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
      const products = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
      const reload = () => setReloadKey(k => k + 1);

      const productMap = useMemo(() => products.reduce((m, p) => (m[p.id] = p, m), {}), [products]);
      const byId = useMemo(() => movements.reduce((m, mv) => (m[mv.id] = mv, m), {}), [movements]);
      // running per-product balance: cumulate oldest→newest, tag each row with the balance right after it
      const tableData = useMemo(() => {
        const sorted = [...movements].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        const run = {};
        return sorted.map(m => {
          run[m.productId] = (run[m.productId] || 0) + (m.type === 'in' ? m.qty : -m.qty);
          return Object.assign({}, m, { productName: productMap[m.productId]?.name || 'Unknown Product', balance: run[m.productId] });
        });
      }, [movements, productMap]);

      useEffect(() => {
        if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load stock movements' });
      }, [err, data]);

      useEffect(() => {
        if (loading) return;
        let table = tableInstanceRef.current;
        if (table) {
          table.clear().rows.add(tableData).draw(false);
        } else {
          table = $('#stockTable').DataTable({
            data: tableData,
            columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
            columns: [
              { data: 'productName', title: 'Product', render: (d, t) => t === 'display' ? esc(d) : d },
              { data: 'type', title: 'Type', render: (d, t) => t === 'display' ? `<span class="status-badge ${d === 'in' ? 'status-active' : 'status-inactive'}">${d === 'in' ? 'IN' : 'OUT'}</span>` : d },
              { data: 'qty', title: 'Qty', render: (d, t) => t === 'display' ? Number(d).toLocaleString() : d },
              { data: 'unitCost', title: 'Unit Cost', defaultContent: '-', render: (d, t) => t === 'display' ? (d ? money(d) : '-') : (d || 0) },
              { data: 'reason', title: 'Reason', render: (d, t) => t === 'display' ? esc(d || '') : d },
              { data: 'reference', title: 'Reference', defaultContent: '-', render: (d, t) => t === 'display' ? esc(d || '-') : d },
              { data: 'balance', title: 'Balance', render: (d, t) => t === 'display' ? `<strong>${Number(d).toLocaleString()}</strong>` : d },
              { data: 'performedBy', title: 'Performed By', render: (d, t) => t === 'display' ? esc(d || '') : d },
              { data: 'createdAt', title: 'When', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
              { data: null, title: 'Actions', orderable: false, render: () => role === 'Admin' ? `<button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>` : '' }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[8, 'desc']]
          });
          tableInstanceRef.current = table;
        }
        $('#stockTable').off('click', '.action-icon').on('click', '.action-icon', function () {
          const id = table.row($(this).parents('tr')).data().id;
          if ($(this).data('action') === 'delete') handleDelete(byId[id]);
        });
      }, [loading, tableData, role]);

      useEffect(() => () => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) { } }
      }, []);

      const handleSave = async (moveData, productName) => {
        const { updateCost, ...move } = moveData; // updateCost is a UI flag, not stored on the ledger row
        setLoad(move.type === 'in' ? 'Recording Stock In...' : 'Recording Stock Out...');
        const result = await fbAddStockMovement(move, productName, user);
        if (result.success && updateCost && move.unitCost) await fbUpdateProduct(move.productId, { cost: Number(move.unitCost) }, user);
        setLoad('');
        if (result.success) {
          setModalType(null); setShowAdjust(false);
          Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
          reload();
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        }
      };

      const handleDelete = (mv) => {
        const productName = productMap[mv.productId]?.name || mv.productId;
        Swal.fire({ icon: 'warning', title: 'Delete Stock Entry?', text: 'This retroactively changes historical Qty On Hand. This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
          if (!result.isConfirmed) return;
          setLoad('Deleting stock entry...');
          const r = await fbDeleteStockMovement(mv.id, `${mv.qty} x ${productName}`, user);
          setLoad('');
          if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
          else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
        });
      };

      const handleBulkSave = async (lines) => {
        setLoad('Receiving stock...');
        const result = await fbBulkStockIn(lines, user);
        setLoad('');
        if (result.success) {
          setShowBulkIn(false);
          Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
          reload();
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        }
      };

      return (
        <div className="data-section">
          {load && <TopLoadingBar />}
          <div className="section-header">
            <h2><i className="fas fa-dolly"></i> Stock In / Out</h2>
            <div className="stock-btns">
              <RefreshBtn onClick={reload} />
              <button className="btn btn-success" disabled={loading} onClick={() => setModalType('in')}><i className="fas fa-arrow-down"></i> Stock In</button>
              <button className="btn btn-danger" disabled={loading} onClick={() => setModalType('out')}><i className="fas fa-arrow-up"></i> Stock Out</button>
              <button className="btn btn-secondary" disabled={loading} onClick={() => setShowBulkIn(true)}><i className="fas fa-truck-ramp-box"></i> Bulk Receive</button>
              <button className="btn btn-secondary" disabled={loading} onClick={() => setShowAdjust(true)}><i className="fas fa-scale-balanced"></i> Stocktake</button>
            </div>
          </div>
          {loading && <TableSkeleton rows={8} columns={10} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="stockTable" className="display" style={{ width: '100%' }}></table>
          </div>
          {modalType && <StockMovementModal type={modalType} products={products} movements={movements} onClose={() => setModalType(null)} onSave={handleSave} />}
          {showBulkIn && <BulkStockInModal products={products} onClose={() => setShowBulkIn(false)} onSave={handleBulkSave} />}
          {showAdjust && <StockAdjustModal products={products} movements={movements} onClose={() => setShowAdjust(false)} onSave={handleSave} />}
        </div>
      );
    }

    // --- Camera scan modal (secondary path, feeds the same resolve function as manual input) ---
    function CameraScanModal({ onDetected, onClose }) {
      // html5-qrcode's stop() throws SYNCHRONOUSLY (not a rejected promise) once the scanner
      // is already stopped - a .catch() after it doesn't help. runningRef gates every stop()
      // call so the decode callback and the unmount cleanup can never both call it.
      const scannerRef = useRef(null);
      const runningRef = useRef(false);

      useEffect(() => {
        let cancelled = false;
        const qr = new Html5Qrcode('pos-qr-reader');
        scannerRef.current = qr;

        const safeStop = () => {
          if (!runningRef.current) return;
          runningRef.current = false;
          try { qr.stop().then(() => qr.clear()).catch(() => { }); } catch (e) { /* already stopped */ }
        };

        qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (decodedText) => {
          if (cancelled) return;
          cancelled = true;
          safeStop();
          onDetected(decodedText);
        }, () => { }).then(() => {
          runningRef.current = true;
          if (cancelled) safeStop(); // modal was closed while the camera was still starting up
        }).catch((err) => {
          Swal.fire({ icon: 'error', title: 'Camera Error', text: 'Could not start camera: ' + (err && err.message ? err.message : err) });
          onClose();
        });
        return () => {
          cancelled = true;
          safeStop();
        };
      }, []);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{ maxWidth: '480px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-camera"></i> Scan with Camera</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>

              <div className="pos-camera-frame"><div id="pos-qr-reader"></div></div>
              <p style={{ textAlign: 'center', color: '#888', fontSize: 13, marginTop: 12 }}>Point the camera at the product's QR code or barcode</p>
            </div>
          </div>
        </div>
      );
    }
